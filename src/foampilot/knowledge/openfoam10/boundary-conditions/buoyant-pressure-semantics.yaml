content:
  summary: buoyantFoam 求解静水压缩减压力 p_rgh，并根据 p_rgh、密度、重力压头和压力参考重构热力学压力 p。
  rules:
    - 保持 p 为可压缩状态方程使用的热力学压力。
    - 保证 p_rgh 与 p 减去静水压头及所选压力参考后的结果一致。
    - 对采用 fixedFluxPressure 壁面、以均匀热力学工作压力初始化的封闭腔体，稳定基线是均匀零缩减压力；不要在 p 和 p_rgh 中重复写入工作压力。
    - 将 pRefCell 与 pRefValue 作为缩减压力规范的锚点，而不是工作压力的替代。封闭腔体若在 constant/pRef 中设置热力学工作压力并将 p_rgh 初始化为零，则 PIMPLE 中应使用 pRefValue 0；把工作压力写入 pRefValue 会在缩减压力求解中重复加入参考压力。
    - 压力边界条件必须与速度通量以及各 patch 的封闭或开放性质一致。
  failure_signals:
    - p is initialized near zero for a perfect-gas operating-pressure case.
    - p and p_rgh encode incompatible hydrostatic states.
    - Initial continuity and Courant numbers explode because both p and p_rgh were initialized to the operating pressure.
    - A pRefValue meaning is copied from an unrelated pressure formulation.
    - constant/pRef is the operating pressure but PIMPLE also uses that operating pressure as pRefValue instead of the reduced-pressure gauge value zero.
  validation:
    - 联合核对 p、p_rgh、重力基准、工作压力、pRefCell 和 pRefValue。
    - 验证重构的热力学压力保持有限、为正且物理上合理。
