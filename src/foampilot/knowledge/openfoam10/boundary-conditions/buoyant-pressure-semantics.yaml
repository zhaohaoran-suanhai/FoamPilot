leakage:
  visibility: public
  families: []
  contains_target_case_solution: false
content:
  summary: buoyantFoam solves the hydrostatic-reduced pressure p_rgh and reconstructs thermodynamic p from p_rgh, density, gravitational head, and the pressure reference.
  rules:
    - Keep p as thermodynamic pressure for the compressible equation of state.
    - Keep p_rgh consistent with p minus hydrostatic head and the chosen pressure reference.
    - Treat pRefCell and pRefValue as the reduced-pressure gauge anchor, not as a replacement for operating pressure.
    - Use pressure boundary conditions that match the velocity flux and the closed or open nature of each patch.
  failure_signals:
    - p is initialized near zero for a perfect-gas operating-pressure case.
    - p and p_rgh encode incompatible hydrostatic states.
    - A pRefValue meaning is copied from an unrelated pressure formulation.
  validation:
    - Inventory p, p_rgh, gravity datum, operating pressure, pRefCell, and pRefValue together.
    - Verify reconstructed thermodynamic pressure stays finite, positive, and physically plausible.
