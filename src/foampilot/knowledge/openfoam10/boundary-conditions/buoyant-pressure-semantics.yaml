id: of10.boundary.buoyant-pressure-semantics
title: buoyantFoam thermodynamic and reduced-pressure semantics
fork: foundation
version: "10"
knowledge_type: boundary_condition
solvers: [buoyantFoam]
models: [compressible, buoyant, p_rgh]
tags: [buoyantfoam, pressure, p_rgh, reference]
applicability:
  conditions:
    - A Foundation v10 compressible buoyant solver uses p and p_rgh.
    - Gravity and a thermodynamic operating pressure are present.
  not_applicable:
    - The solver uses only incompressible kinematic pressure.
source:
  kind: official_source
  title: OpenFOAM Foundation v10 buoyantFoam pressure equation
  locator: OpenFOAM-10/applications/solvers/heatTransfer/buoyantFoam/pEqn.H
  sha256: 92de947badaa0be280ebfefbd066a72361049ab934acdb9678afec674aaf03ee
