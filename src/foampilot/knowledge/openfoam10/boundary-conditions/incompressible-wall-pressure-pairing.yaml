schema_version: 1.0.0
id: of10.boundary.incompressible-wall-pressure-pairing
title: 不可渗透壁面的速度与压力边界配对
fork: foundation
version: "10"
knowledge_type: boundary_condition
solvers: [icoFoam]
models: [incompressible, wall]
tags: [boundary, pressure, velocity, wall]
applicability:
  conditions:
    - 该 patch 是不可压缩算例中的不可渗透静止壁面或运动壁面。
    - 压力为运动压力，且壁面没有指定固定压力值。
  not_applicable:
    - 该 patch 是入口、出口、自由表面、耦合界面或可压缩边界时不适用。
source:
  kind: official_source
  title: OpenFOAM Foundation v10 zero-gradient finite-volume patch field
  locator: OpenFOAM-10/src/finiteVolume/fields/fvPatchFields/basic/zeroGradient/zeroGradientFvPatchField.H
  sha256: 5488561945e23ae3f3fc0a891d002a27774b3e8800a3426705bb7340d8bff7a8
  license_spdx: GPL-3.0-or-later
leakage:
  visibility: public
  families: []
  contains_target_case_solution: false
content:
  summary: 不可渗透壁面约束速度，而运动压力通常采用零法向梯度；具体速度值取决于壁面是静止还是按指定方式运动。
  rules:
    - 根据物理运动为 U 使用 noSlip 或固定壁面速度。
    - 壁面没有压力值作为锚点时，p 使用 zeroGradient。
    - U 与 p 的 boundaryField dictionary 都必须覆盖每个 mesh patch。
  failure_signals:
    - A wall patch is missing from one field.
    - Moving-wall velocity contradicts the requested motion.
  validation:
    - 将每个 field 的 patch 集合与 mesh patch 集合逐一比较。
    - 对照物理需求检查速度大小和方向。
