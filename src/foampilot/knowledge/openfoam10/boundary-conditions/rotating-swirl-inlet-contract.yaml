  title: OpenFOAM Foundation v10 cylindricalInletVelocity patch-field source
  locator: OpenFOAM-10/src/finiteVolume/fields/fvPatchFields/derived/cylindricalInletVelocity/cylindricalInletVelocityFvPatchVectorField.C
