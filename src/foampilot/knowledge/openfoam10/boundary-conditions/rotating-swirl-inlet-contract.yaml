content:
  summary: Native Foundation v10 cylindrical and swirling inlet patch fields need a complete geometric frame and velocity functions before any utility reads the field.
  rules:
    - For cylindricalInletVelocity provide origin, a non-zero axis, axialVelocity, radialVelocity, rpm, and an initialized value entry.
    - For swirlInletVelocity provide origin, a non-zero axis, axialVelocity, radialVelocity, tangentialVelocity, and value.
    - For swirlFlowRateInletVelocity provide flowRate, rpm, value, and explicitly state origin and axis for deterministic geometry even though the implementation can infer defaults.
    - Keep the frame consistent with the mesh and inlet normal. Check units and signs of rpm, flow rate, and axial velocity independently.
    - refineHexMesh -noFields can avoid mapping fields during refinement, but it does not make an incomplete boundary dictionary valid for the later solver. Every written field must still construct successfully.
  failure_signals:
    - blockMesh succeeds but a field-reading utility reports origin, axis, axialVelocity, radialVelocity, tangentialVelocity, flowRate, rpm, or value as undefined.
    - The solver starts with a zero or reversed inlet because the declared axis and patch normal disagree.
  validation:
    - Require all preprocessing utilities to read U successfully before the main solve.
    - Confirm the inlet velocity has the requested axial flux and tangential direction without using a target-case field.
