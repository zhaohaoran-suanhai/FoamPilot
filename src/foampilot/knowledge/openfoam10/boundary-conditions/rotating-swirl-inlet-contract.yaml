schema_version: 1.0.0
id: of10.boundary.rotating-swirl-inlet-contract
title: 原生圆柱坐标与旋流入口速度契约
fork: foundation
version: "10"
knowledge_type: boundary_condition
solvers: []
models: [cylindricalInletVelocity, swirlInletVelocity, swirlFlowRateInletVelocity]
tags: [swirl, rotating-inlet, cylindrical, origin, axis, rpm, flow-rate]
activation_terms:
  - swirl
  - swirling inlet
  - rotating inlet
  - cylindrical inlet
  - tangential velocity
  - rpm
applicability:
  conditions:
    - 速度入口需要围绕已声明轴线定义轴向、径向或切向运动。
    - 应使用原生 Foundation v10 边界条件替代自定义 coded patch 逻辑。
  not_applicable:
    - patch 只有均匀 Cartesian 速度且不存在旋转时不适用。
source:
