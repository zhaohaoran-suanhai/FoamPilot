title: Native cylindrical and swirling inlet velocity contract
fork: foundation
version: "10"
knowledge_type: boundary_condition
solvers: []
models: [cylindricalInletVelocity, swirlInletVelocity, swirlFlowRateInletVelocity]
tags: [swirl, rotating-inlet, cylindrical, origin, axis, rpm, flow-rate]
activation_terms:
  - swirl
  - swirling inlet
  - rotating inlet
  - cylindrical inlet
  - tangential velocity
  - rpm
applicability:
  conditions:
    - A velocity inlet requires axial, radial, or tangential motion about a declared axis.
    - A native Foundation v10 boundary condition should replace custom coded patch logic.
  not_applicable:
    - The patch has uniform Cartesian velocity without rotation.
