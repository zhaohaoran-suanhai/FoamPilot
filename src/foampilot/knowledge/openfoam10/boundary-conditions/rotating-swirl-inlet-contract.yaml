leakage:
  visibility: public
  families: []
  contains_target_case_solution: false
content:
  summary: 原生 Foundation v10 圆柱坐标与旋流入口 patch field 必须在任何 utility 读取字段前提供完整几何坐标系和速度函数。
  rules:
    - cylindricalInletVelocity 必须提供 origin、非零 axis、axialVelocity、radialVelocity、rpm 和已初始化的 value 项。
    - swirlInletVelocity 必须提供 origin、非零 axis、axialVelocity、radialVelocity、tangentialVelocity 和 value。
    - swirlFlowRateInletVelocity 必须提供 flowRate、rpm 与 value；即使实现能够推断默认值，也要显式声明 origin 和 axis，以获得确定性几何定义。
    - 坐标系必须与网格和入口法向一致，并分别检查 rpm、flow rate 和 axial velocity 的单位与符号。
    - refineHexMesh -noFields 可以避免细化期间映射字段，但不能使不完整的 boundary dictionary 在后续 solver 中变为合法；每个写出字段仍必须能够成功构造。
  failure_signals:
    - blockMesh succeeds but a field-reading utility reports origin, axis, axialVelocity, radialVelocity, tangentialVelocity, flowRate, rpm, or value as undefined.
    - The solver starts with a zero or reversed inlet because the declared axis and patch normal disagree.
  validation:
    - 主要求解前，要求所有 preprocessing utility 都能成功读取 U。
    - 在不使用目标算例字段的前提下，确认入口速度具有要求的轴向通量与切向方向。
