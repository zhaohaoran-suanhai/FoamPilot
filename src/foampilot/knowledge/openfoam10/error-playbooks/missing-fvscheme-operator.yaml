schema_version: 1.0.0
id: of10.error.missing-fvscheme-operator
title: 修复 fvSchemes 中缺失的离散算子
fork: foundation
version: "10"
knowledge_type: error_playbook
solvers: []
models: []
tags: [fvschemes, operator, dictionary, undefined, repair]
applicability:
  conditions:
    - 求解日志明确指出某个算子关键字在 system/fvSchemes 中未定义。
    - 缺失项属于目标求解器实际组装的方程，而不是未执行的可选后处理。
  not_applicable:
    - 日志报告的是字段、patch、物性或 fvSolution 求解器段缺失时不适用。
source:
  kind: official_source
  title: OpenFOAM Foundation v10 dictionary typed lookup diagnostics
  locator: OpenFOAM-10/src/OpenFOAM/db/dictionary/dictionaryTemplates.C
  sha256: 738a49e1ce839df116a12dcc2a648ed3876a90c4a8996cf8fb3abd8646791851
