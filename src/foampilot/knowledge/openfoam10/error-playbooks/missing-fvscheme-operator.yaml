leakage:
  visibility: public
  families: []
  contains_target_case_solution: false
content:
  summary: 日志出现 fvSchemes keyword 或 operator undefined 时，从目标方程识别唯一缺失离散项并做最小字典修复。
  rules:
    - 保留完整 fatal message，包括请求的关键字和字典路径。
    - 对照目标求解器、已声明模型和现有字段确认该算子确实会被执行。
    - 只在正确的 gradSchemes、divSchemes、laplacianSchemes、interpolationSchemes 或 snGradSchemes 段补充该项。
    - 复用同一离散格式之前，确认通量、字段类型和稳态或瞬态语义相容。
    - 在新 attempt 中重新运行静态检查、网格步骤和目标求解器。
  failure_signals:
    - keyword div(...) is undefined in dictionary .../fvSchemes
    - keyword grad(...) is undefined in dictionary .../fvSchemes
    - keyword laplacian(...) is undefined in dictionary .../fvSchemes
  validation:
    - 新 attempt 不再报告同一缺失算子。
    - 没有为了消除报错而添加与目标方程无关的通配条目。
    - 目标求解器启动后的字段保持有限。
