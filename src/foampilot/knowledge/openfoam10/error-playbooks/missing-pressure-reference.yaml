schema_version: 1.0.0
id: of10.error.missing-pressure-reference
title: 修复未解析的压力参考
fork: foundation
version: "10"
knowledge_type: error_playbook
solvers: [icoFoam]
models: [PISO, closed-domain]
tags: [fatal-io, pressure, repair, fvsolution]
applicability:
  conditions:
    - 日志明确报告无法为 p 设置 reference cell。
    - 压力边界审查确认不存在 fixed-value 压力锚点。
  not_applicable:
    - 日志指向其他字段，或计算域已存在有意设置的压力锚点时不适用。
source:
  kind: official_source
  title: OpenFOAM Foundation v10 pressure reference selection
  locator: OpenFOAM-10/src/finiteVolume/cfdTools/general/findRefCell/findRefCell.C
  sha256: 35b61c874b77a23862a372729da793175e1f4d4b6e89f3f76e65d05d3b406a7f
  license_spdx: GPL-3.0-or-later
leakage:
  visibility: public
  families: []
  contains_target_case_solution: false
content:
  summary: 先分类精确的 fatal message 并确认压力零空间，再在新的 attempt 中对 fvSolution 做一次最小修复。
  rules:
    - 修改任何内容前，保留失败日志和算例。
    - 在 PISO 下添加一个有效的 pRefCell 和 pRefValue。
    - 在新的不可变 attempt 中重新运行 lint 和完整已批准流水线。
  failure_signals:
    - Unable to set reference cell for field p.
  validation:
    - 新 attempt 不再出现 reference-cell fatal error。
    - completion、final-time 与 continuity 检查仍然通过。
