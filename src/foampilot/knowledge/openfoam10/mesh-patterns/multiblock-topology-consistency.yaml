content:
  summary: 多块 blockMesh 的共享面必须由相同几何顶点构成，patch face 必须匹配真实 block face，且相邻边分段保持一致。
  rules:
    - 为所有全局顶点分配唯一坐标和稳定 label，逐块使用外向一致的 hex 顶点顺序。
    - 内部共享面不得再次列入 boundary；相邻 block 必须引用同一组全局顶点。
    - 共享面的对应边采用相同 cell 数；grading 可以不同，但必须保持拓扑连通和正体积。
    - curved edge/face 必须对应实际 block edge/face，不能引用不存在或重复的拓扑实体。
    - blockMesh 后必须运行 checkMesh；修复 topology error 时优先修正最早报告的 face 或 edge。
  failure_signals:
    - Block mesh topology incorrect
    - does not match any block faces
    - does not correspond to a block edge
    - inward-pointing faces
  validation:
    - blockMesh 正常结束且没有 undefined boundary faces，二维明确允许的前后面除外。
    - checkMesh 报告正确 cell 数、patch 数、正体积和可接受的拓扑质量。
    - 相邻 block 的共享面只形成内部面，不形成重复或裂开的边界面。
