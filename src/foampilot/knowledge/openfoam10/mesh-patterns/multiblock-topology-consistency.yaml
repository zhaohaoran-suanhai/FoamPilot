id: of10.mesh.multiblock-topology-consistency
title: blockMesh 多块网格拓扑一致性
fork: foundation
version: "10"
knowledge_type: mesh_pattern
solvers: [blockMesh]
models: [multiblock]
tags: [blockmesh, multiblock, topology, faces, vertices, mesh]
applicability:
  conditions:
    - 几何由两个或更多相邻 hex block 构造，或包含曲边、分段加密与内部共享面。
    - 网格需要保持共享面的点序、分段数和 grading 相容。
  not_applicable:
    - 单一规则 hex block，或网格完全由外部 surface/volume mesher 生成时不适用。
