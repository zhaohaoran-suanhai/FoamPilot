leakage:
  visibility: public
  families: []
  contains_target_case_solution: false
content:
  summary: A two-dimensional finite-volume case uses one cell through the suppressed direction and empty mesh and field patches on both bounding planes.
  rules:
    - Use exactly one cell through the suppressed direction.
    - Assign mesh type empty to both bounding planes.
    - Assign field type empty on the same patch for every volume field.
    - Every boundary face must match an actual block cell face. For a collapsed hex, keep the boundary face consistent with the repeated block vertices or avoid the degenerate block; do not invent a triangular boundary face that has no neighbour cell face.
  failure_signals:
    - Mesh and field patch types disagree.
    - More than one solution cell exists through the suppressed direction.
  validation:
    - checkMesh reports two geometric and two solution directions.
    - Every field covers the empty patch with type empty.
