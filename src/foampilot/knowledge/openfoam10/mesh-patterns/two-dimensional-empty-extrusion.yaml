id: of10.mesh.two-dimensional-empty-extrusion
title: 二维网格的单层 empty 挤出
fork: foundation
version: "10"
knowledge_type: mesh_pattern
solvers: [blockMesh]
models: [two-dimensional]
tags: [blockmesh, empty, two-dimensional, mesh]
applicability:
  conditions:
    - 物理解是二维的，网格为薄层挤出网格。
    - 前后两个平面都垂直于被抑制的求解方向。
  not_applicable:
    - 必须解析三维梯度或面外物理时不适用。
source:
