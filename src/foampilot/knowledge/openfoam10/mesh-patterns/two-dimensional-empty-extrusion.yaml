schema_version: 1.0.0
id: of10.mesh.two-dimensional-empty-extrusion
title: One-cell empty extrusion for two-dimensional meshes
fork: foundation
version: "10"
knowledge_type: mesh_pattern
solvers: [blockMesh]
models: [two-dimensional]
tags: [blockmesh, empty, two-dimensional, mesh]
applicability:
  conditions:
    - The physical solution is two-dimensional and the mesh is a thin extrusion.
    - The two front/back planes are normal to the suppressed solution direction.
  not_applicable:
    - Three-dimensional gradients or out-of-plane physics must be resolved.
source:
  kind: official_source
  title: OpenFOAM Foundation v10 empty finite-volume patch field
  locator: OpenFOAM-10/src/finiteVolume/fields/fvPatchFields/constraint/empty/emptyFvPatchField.H
  sha256: 4030eedcabdaa2caef801e5d383c172257515efdf9d967d8e90a0e320d47615c
