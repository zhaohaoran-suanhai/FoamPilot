content:
  summary: 二维有限体积算例在被抑制方向只使用一个 cell，并在两侧边界平面上的 mesh 与 field 中都采用 empty patch。
  rules:
    - 被抑制方向必须恰好使用一个 cell。
    - 两个边界平面的 mesh type 都设置为 empty。
    - 每个 volume field 在相同 patch 上都设置 field type empty。
    - 每个 boundary face 都必须对应实际的 block cell face。对塌缩 hex，应让 boundary face 与重复的 block vertex 保持一致，或避免使用退化 block；不得虚构没有相邻 cell face 的三角形 boundary face。
  failure_signals:
    - Mesh and field patch types disagree.
    - More than one solution cell exists through the suppressed direction.
  validation:
    - checkMesh 报告两个 geometric direction 和两个 solution direction。
    - 每个字段都以 type empty 覆盖对应 empty patch。
