content:
  summary: Foundation v10 interFoam couples MULES phase-fraction correction, alpha correctors and sub-cycles, and flow/interface Courant limits; strict boundedness requires conservative controls plus all-time evidence, not only successful completion.
  rules:
    - Treat maxCo and maxAlphaCo as safety ceilings, not accuracy targets. When strict phase-fraction bounds are required, configure them strictly below the public ceilings instead of copying the allowed maxima, and cap maxDeltaT consistently with the mesh and interface motion.
    - Declare nAlphaCorr and nAlphaSubCycles explicitly. MULESCorr and nLimiterIter control the bounded correction process, but their presence alone is not proof that the requested tolerance is met.
    - Record all-time extrema and phase-volume history with native function objects on every time step. Do not infer boundedness from the final field or normal End marker.
    - If a completed finite run violates a bound, keep geometry, material properties, boundary conditions, and initialization fixed. First test a smaller time-step/interface-Courant family; only if the overshoot persists, test one alpha correction, sub-cycling, or limiter family.
    - Change one causal family per repair and rerun the full requested interval. Do not weaken a public tolerance to turn an observed overshoot into a pass.
    - Accept the numerical repair only when all-time lower and upper bounds and phase-volume conservation pass together.
  failure_signals:
    - The solver reaches End but an all-time phase-fraction extremum exceeds the public tolerance.
    - The reported interface Courant number repeatedly approaches its configured ceiling while extrema deteriorate.
    - Tightening the time-step family changes the overshoot materially, indicating temporal/interface-transport sensitivity.
    - Bounds improve but phase-volume drift worsens, so the repair is not physically acceptable.
  validation:
    - Parse every recorded minimum and maximum, including intermediate MULES-corrected states when exposed by the selected evidence contract.
    - Compare the worst all-time extrema with the public tolerance and reject final-time-only evidence.
    - Compare the first and last recorded phase-volume integrals after successful regional initialization.
    - Preserve the failed run, the one-family repair decision, the rerun logs, and the unchanged-control statement.
