content:
  summary: Foundation v10 interFoam 耦合 MULES 相分数修正、alpha corrector 与 sub-cycle，以及流动/界面 Courant 上限；严格有界性需要保守控制和全时段证据，不能只依据正常结束。
  rules:
    - 将 maxCo 和 maxAlphaCo 视为安全上限，而不是精度目标。要求严格相分数界限时，两者应严格低于公开上限，不能照抄允许最大值；maxDeltaT 也必须与网格和界面运动一致地受限。
    - 显式声明 nAlphaCorr 和 nAlphaSubCycles。MULESCorr 与 nLimiterIter 控制有界修正过程，但仅有这些设置不能证明满足要求的容差。
    - 公开任务明确要求全时段日志证据时，为相字段配置三个 Foundation v10 volFieldValue function object，在每个时间步记录；使用 type volFieldValue、writeFields false、regionType all，并分别设置 operation min、operation max 与 operation volIntegrate。Foundation v10 不提供 fieldMinMax，不能使用这一跨发行版 function type。普通输出时刻的证据应由 evaluator 检查写出字段。不得根据最终字段或正常 End 标记推断有界性。
    - 已完成且字段有限的 run 违反界限时，保持几何、材料属性、边界条件和初始化不变。先测试更小的 time-step/interface-Courant 参数族；只有 overshoot 持续存在时，才测试一个 alpha correction、sub-cycling 或 limiter 参数族。
    - 每次 repair 只改变一个因果参数族，并重跑完整要求区间。不得通过放宽公开容差把已观测 overshoot 变成通过。
    - 只有全时段上下界与 phase-volume conservation 同时通过，才能接受数值修复。
  failure_signals:
    - The solver reaches End but an all-time phase-fraction extremum exceeds the public tolerance.
    - The reported interface Courant number repeatedly approaches its configured ceiling while extrema deteriorate.
    - Tightening the time-step family changes the overshoot materially, indicating temporal/interface-transport sensitivity.
    - Bounds improve but phase-volume drift worsens, so the repair is not physically acceptable.
  validation:
    - 解析每个已记录的 minimum 与 maximum；若所选证据契约暴露 MULES 修正中间状态，也要一并解析。
    - 将全时段最差 extrema 与公开容差比较，并拒绝只有 final-time 的证据。
    - 区域初始化成功后，比较首个与末个记录的 phase-volume integral。
    - 保留失败 run、单参数族 repair decision、重跑日志和 unchanged-control 说明。
