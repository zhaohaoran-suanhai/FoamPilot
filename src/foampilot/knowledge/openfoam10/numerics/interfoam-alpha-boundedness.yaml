applicability:
  conditions:
    - Foundation v10 interFoam 算例必须在完整瞬态区间内将相分数字段保持在声明的有限容差内。
    - 算例使用自适应或固定全局时间步，以及代数 VOF 界面捕获方法。
  not_applicable:
    - 任务使用具有不同控制语义的几何界面捕获方法时不适用。
    - 相分数被有意用作无界输运标量时不适用。
