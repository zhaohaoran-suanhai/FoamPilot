applicability:
  conditions:
    - A Foundation v10 interFoam case must keep a phase-fraction field within a stated finite tolerance over the full transient interval.
    - The case uses adaptive or fixed global time stepping and algebraic VOF interface capture.
  not_applicable:
    - The task uses a geometric interface-capturing method with different control semantics.
    - A phase fraction intentionally represents an unbounded transported scalar.
