schema_version: 1.0.0
id: of10.numerics.piso-closed-pressure-reference
title: 封闭 PISO 计算域的压力参考
fork: foundation
version: "10"
knowledge_type: numerics
solvers: [icoFoam]
models: [PISO, closed-domain]
tags: [piso, pressure, reference, nullspace]
applicability:
  conditions:
    - 所有压力边界均类似 Neumann 条件，压力只在相差任意常数的意义下确定。
    - PISO 算法需要唯一的压力基准。
  not_applicable:
    - fixed pressure 边界或其他模型已固定压力基准时不适用。
source:
  kind: official_source
  title: OpenFOAM Foundation v10 pressure reference selection
  locator: OpenFOAM-10/src/finiteVolume/cfdTools/general/findRefCell/findRefCell.C
  sha256: 35b61c874b77a23862a372729da793175e1f4d4b6e89f3f76e65d05d3b406a7f
  license_spdx: GPL-3.0-or-later
leakage:
  visibility: public
  families: []
  contains_target_case_solution: false
content:
  summary: 只有压力梯度条件的封闭不可压缩计算域存在常数压力零空间，因此需要一个 PISO 压力参考。
  rules:
    - 在 PISO dictionary 中声明 pRefCell 和 pRefValue。
    - 选择有效 cell index 与一致的 reference value。
    - 不得仅为消除报错而添加第二个物理压力约束。
  failure_signals:
    - Unable to set reference cell for field p.
    - The solver exits after reading U, p, and phi but before time stepping.
  validation:
    - 所选 pRefCell 在生成网格中确实存在。
    - icoFoam 能进入时间推进，且不出现 pressure-reference fatal error。
