content:
  summary: Foundation adaptive stepping computes a Courant-limited next step and then caps it by maxDeltaT, so maxDeltaT can prevent an otherwise requested increase.
  rules:
    - Treat deltaT as the initial step and maxDeltaT as the adaptive upper bound.
    - When growth is required, require maxDeltaT strictly greater than the initial deltaT.
    - Inspect the actual Courant history because declarations alone do not prove the requested target is active.
    - Check transient accuracy against a public analytical or convergence criterion rather than maximizing the time step.
  failure_signals:
    - maxDeltaT equals deltaT while adjustTimeStep is enabled.
    - Observed maximum Courant remains far below maxCo because the cap is active.
    - Solver completion and conservation pass but wave propagation is inaccurate.
  validation:
    - Record deltaT, maxDeltaT, maxCo, and observed maximum Courant.
    - For an ideal-gas Riemann problem, compare rarefaction, contact, and shock positions with the exact public solution.
