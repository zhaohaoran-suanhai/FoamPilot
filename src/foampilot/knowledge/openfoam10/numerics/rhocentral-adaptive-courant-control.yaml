tags: [rhocentralfoam, timestep, courant, shock]
applicability:
  conditions:
    - Foundation v10 可压缩瞬态求解器使用 adjustTimeStep 与 maxCo。
    - 必须依据公开物理检查波传播或其他时间精度要求。
  not_applicable:
    - 稳态求解器仅将 controlDict index 作为迭代计数时不适用。
