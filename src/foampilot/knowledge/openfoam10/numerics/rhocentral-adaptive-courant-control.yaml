content:
  summary: Foundation 自适应推进先计算受 Courant 限制的下一时间步，再用 maxDeltaT 截断，因此 maxDeltaT 可能阻止本应发生的步长增长。
  rules:
    - 将 deltaT 视为初始步长，将 maxDeltaT 视为自适应上限。
    - 需要步长增长时，maxDeltaT 必须严格大于初始 deltaT。
    - 检查实际 Courant history，因为仅有声明不能证明要求的目标正在起作用。
    - 使用公开解析或收敛准则检查瞬态精度，而不是追求最大时间步。
  failure_signals:
    - maxDeltaT equals deltaT while adjustTimeStep is enabled.
    - Observed maximum Courant remains far below maxCo because the cap is active.
    - Solver completion and conservation pass but wave propagation is inaccurate.
  validation:
    - 记录 deltaT、maxDeltaT、maxCo 和观测 maximum Courant。
    - 对 ideal-gas Riemann 问题，将 rarefaction、contact 和 shock 位置与公开精确解比较。
