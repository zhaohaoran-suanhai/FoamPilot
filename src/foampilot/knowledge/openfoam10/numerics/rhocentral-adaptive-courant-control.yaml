applicability:
  conditions:
    - A Foundation v10 compressible transient solver uses adjustTimeStep and maxCo.
    - Wave propagation or another time-accuracy requirement must be verified from public physics.
  not_applicable:
    - A steady solver uses the controlDict index only as iteration bookkeeping.
