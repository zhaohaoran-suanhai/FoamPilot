  visibility: public
  families: []
  contains_target_case_solution: false
content:
  summary: 使用本地 MPI 前先建立正确的串行基线；并行执行需要显式 decomposition、受限 rank count、并行 solver flag 与 reconstruction policy。
  rules:
    - 不得仅根据 solver 可用性推断 MPI 支持。
    - 声明正的 rank count，且不得超过实测物理核心上限。
    - "decomposition coefficient 必须匹配所选 Foundation v10 method：hierarchical 使用 hierarchicalCoeffs，simple 使用 simpleCoeffs；通用 coeffs dictionary 不会被读取为任一方法的配置。"
    - 使用已批准的 Runner，并分别保留 requested、eligible 与 observed rank。
  failure_signals:
    - MPI is launched without -parallel or without an explicit rank count.
    - decomposePar reports n or another method coefficient undefined even though it was placed under a generic coeffs dictionary.
    - Parallel results disagree with the qualified serial baseline.
  validation:
    - 接受 MPI 变体前，串行算例必须先通过。
    - 实测 wall time 与结果一致性，不能假设 rank 越多就越快。
