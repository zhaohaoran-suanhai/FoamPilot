schema_version: 1.0.0
id: of10.physics.kinematic-viscosity-physical-properties
title: Foundation v10 physicalProperties 中的运动黏度
fork: foundation
version: "10"
knowledge_type: physics_model
solvers: [icoFoam]
models: [constant-viscosity, incompressible]
tags: [viscosity, physicalproperties, dimensions, laminar]
applicability:
  conditions:
    - 求解器读取常数不可压缩运动黏度。
    - 给定材料属性为以平方米每秒表示的 nu。
  not_applicable:
    - 需要动力黏度、非 Newtonian 输运或热物性时不适用。
source:
  kind: official_source
  title: OpenFOAM Foundation v10 icoFoam field creation
  locator: OpenFOAM-10/applications/solvers/incompressible/icoFoam/createFields.H
  sha256: 6a00e54e585a3cf9407e21f924b8c13068275a357516accb7eba6a4af3cc39f6
  license_spdx: GPL-3.0-or-later
leakage:
  visibility: public
  families: []
  contains_target_case_solution: false
content:
  summary: Foundation v10 icoFoam 从 constant/physicalProperties 读取常数运动黏度 nu，其量纲为长度平方除以时间。
  rules:
    - nu 必须使用量纲 [0 2 -1 0 0 0 0]。
    - 编写算例前，将材料数据转换为平方米每秒。
    - 明确区分动力黏度与运动黏度。
  failure_signals:
    - physicalProperties or nu cannot be read.
    - Reynolds number is inconsistent by a density or unit factor.
  validation:
    - 使用已编写的长度、速度与 nu 重新计算 Reynolds number。
    - 检查解析后的 physicalProperties 数值与量纲。
