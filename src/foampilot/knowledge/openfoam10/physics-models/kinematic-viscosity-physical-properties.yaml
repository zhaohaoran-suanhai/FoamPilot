leakage:
  visibility: public
  families: []
  contains_target_case_solution: false
content:
  summary: Foundation v10 icoFoam reads constant kinematic viscosity nu from constant/physicalProperties with dimensions of length squared per time.
  rules:
    - Store nu with dimensions [0 2 -1 0 0 0 0].
    - Convert material data to square metres per second before authoring.
    - Keep dynamic and kinematic viscosity distinct.
  failure_signals:
    - physicalProperties or nu cannot be read.
    - Reynolds number is inconsistent by a density or unit factor.
  validation:
    - Recompute Reynolds number from the authored length, velocity, and nu.
    - Inspect the resolved physicalProperties value and dimensions.
