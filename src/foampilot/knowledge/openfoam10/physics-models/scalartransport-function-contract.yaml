content:
  summary: Foundation v10 scalarTransport function object 读取显式 diffusion mode，并使用具名 scalar、flux、scheme 与 fvSolution 控制。
  rules:
    - 当默认值符合公开任务时，优先使用原生 #includeFunc scalarTransport(fieldName) 形式。
    - 显式 dictionary 必须提供 type scalarTransport、scalar field name 和必需 diffusion 项。Foundation v10 有效 diffusion mode 为 none、constant 和 viscosity。
    - diffusion constant 还要提供 D；diffusion viscosity 要提供 alphal 与 alphat。即使不需要扩散，也不能省略 diffusion，应写 diffusion none。
    - 提供可读取的 scalar field、div(phi,schemesField)，以及所选有界或无界输运路径要求的 scalar solver control。
    - 不得使用 coded function object 替代这一内置行为。
  failure_signals:
    - Startup reports keyword diffusion is undefined in controlDict/functions.
    - A constant diffusion mode cannot find D, or a viscosity mode cannot find alphal or alphat.
    - The scalar field is present but remains unchanged because no scalarTransport function object or solver was configured.
  validation:
    - 要求 flow solver 正常结束，且 scalar 在要求输出时刻保持有限。
    - 将任务给定的 scalar bound 或 conservation 与 flow continuity 分别检查。
