content:
  summary: The Foundation v10 scalarTransport function object reads an explicit diffusion mode and uses the named scalar, flux, schemes, and fvSolution controls.
  rules:
    - Prefer the native #includeFunc scalarTransport(fieldName) form when its defaults match the public task.
    - In an explicit dictionary provide type scalarTransport, the scalar field name, and the required diffusion entry. Valid Foundation v10 diffusion modes are none, constant, and viscosity.
    - For diffusion constant also provide D. For diffusion viscosity provide alphal and alphat. Do not omit diffusion even when no diffusion is intended; write diffusion none.
    - Provide a readable scalar field, div(phi,schemesField), and the scalar solver controls requested by the selected bounded or unbounded transport path.
    - Do not use a coded function object to replace this built-in behavior.
  failure_signals:
    - Startup reports keyword diffusion is undefined in controlDict/functions.
    - A constant diffusion mode cannot find D, or a viscosity mode cannot find alphal or alphat.
    - The scalar field is present but remains unchanged because no scalarTransport function object or solver was configured.
  validation:
    - Require normal flow-solver completion and finite scalar values at the requested output times.
    - Check task-derived scalar bounds or conservation separately from flow continuity.
