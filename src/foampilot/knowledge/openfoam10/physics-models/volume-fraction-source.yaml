id: of10.physics.volume-fraction-source
title: rhoPimpleFoam 体积分数与固体平衡源项契约
fork: foundation
version: "10"
knowledge_type: physics_model
solvers: [rhoPimpleFoam, pimpleFoam]
models: [compressible, volumeFractionSource, solidEquilibriumEnergySource, porous, solid, equilibrium-energy]
tags: [rhopimplefoam, volume-fraction, alpha-volume, alpha-solid, volumephase, solidphase, fvmodels, postprocess]
activation_terms:
  - volume fraction source
  - volumeFractionSource
  - solidEquilibriumEnergySource
  - alpha.volume
applicability:
  conditions:
    - 固定空间体积分数通过 volumeFractionSource 修正表观流体输运。
    - 固定固相分数可能为可压缩能量方程增加平衡固体热惯性。
  not_applicable:
    - 体积分数是被输运的多相字段时不适用。
    - 需要 porous drag 或非平衡固体温度时应使用其他模型。
