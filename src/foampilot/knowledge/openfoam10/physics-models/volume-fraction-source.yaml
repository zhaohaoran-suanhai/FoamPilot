schema_version: 1.0.0
id: of10.physics.volume-fraction-source
title: rhoPimpleFoam volume-fraction and solid-equilibrium source contract
fork: foundation
version: "10"
knowledge_type: physics_model
solvers: [rhoPimpleFoam, pimpleFoam]
models: [compressible, volumeFractionSource, solidEquilibriumEnergySource, porous, solid, equilibrium-energy]
tags: [rhopimplefoam, volume-fraction, alpha-volume, alpha-solid, volumephase, solidphase, fvmodels, postprocess]
applicability:
  conditions:
    - A fixed spatial volume fraction modifies superficial fluid transport through volumeFractionSource.
    - A fixed solid fraction may add equilibrium solid thermal inertia to a compressible energy equation.
  not_applicable:
    - The volume fraction is a transported multiphase field.
    - Porous drag or non-equilibrium solid temperature requires a different model.
source:
  kind: official_source
  title: OpenFOAM Foundation v10 volumeFractionSource and solidEquilibriumEnergySource
  locator: OpenFOAM-10 src/fvModels/derived/volumeFractionSource and src/fvModels/derived/solidEquilibriumEnergySource
  sha256: 21e5acb19d7f0cf1602430b01ff7436194eef562dc6c2da0840ff2944445fe5a
  license_spdx: GPL-3.0-or-later
leakage:
  visibility: public
