content:
  summary: buoyantFoam 通过 PIMPLE loop 耦合可压缩热力学、重力、U、焓、p_rgh、湍流和热物性输运；该 loop 可以使用稳态伪时间计数。
  rules:
    - 提供 physicalProperties、momentumTransport、g、所有必需 pressure-reference 数据、U、p、p_rgh、T、湍流与热扩散字段、fvSchemes、fvSolution 和 controlDict。
    - 保证热力学 p、静水压缩减 p_rgh、重力压头、工作压力、pRefCell 与 pRefValue 相互一致。
    - 稳态任务采用 steadyState 离散，并将 controlDict time 解释为迭代；除非明确需要，否则省略 residualControl。若使用，Foundation v10 PIMPLE residualControl 中每个字段应给出单个 scalar value，而不是 tolerance dictionary。
    - 提供能量与动量方程使用的全部 divergence scheme，包括动能输运项 div(phi,K)。
    - 在 fvSolution/solvers 中同时提供 rho 与 rhoFinal；rho 可使用 diagonal，rhoFinal 应通过 `$rho;` 继承。PIMPLE 最终 pressure correction 会按 final field name 查找，只有 rho 时可能在首步报告 rhoFinal undefined。
    - 当 divSchemes/default 为 none 时，加入精确的 Foundation v10 可压缩黏性应力项 div(((rho*nuEff)*dev2(T(grad(U)))))；运动学形式 div((nuEff*...)) 不满足 buoyantFoam。
    - constant/thermophysicalTransport 必须与 momentumTransport 匹配。Foundation v10 层流算例使用顶层 laminar dictionary，并在其中设置 model Fourier；不要把 model Fourier 包在通用 thermophysicalTransport dictionary 中，因为 runtime selector 查找的是 laminar 子字典。
    - Foundation v10 稳态自然对流基线使用 momentumPredictor no；U、K、焓和输运湍流场采用 bounded Gauss limitedLinear 0.2；初始 relaxation 使用 rho 1.0、p_rgh 0.7、U 与焓 0.3、湍流 0.7。若 residual 或壁面热流不平衡仍高，不得把达到迭代上限视为收敛。
    - 使用一组内部一致的 Foundation v10 湍流 wall function，包括带已声明 turbulent Prandtl number 的可压缩 alphat。
    - 大型三维算例应执行 decompose，以 typed mpi_ranks 运行 solver，并 reconstruct 已接受状态。
  failure_signals:
    - fvSolution reports rhoFinal undefined although a rho solver exists.
    - Perfect-gas p is initialized near zero or p and p_rgh encode incompatible hydrostatics.
    - k, omega, nut, or alphat wall functions are missing or mutually inconsistent.
    - fvSchemes reports div(((rho*nuEff)*dev2(T(grad(U))))) as undefined before the first momentum solve.
    - The iteration cap is reached with poor residual or local-continuity evidence.
    - Temperature and velocity profiles look plausible but the two integrated wall heat flows remain imbalanced because the steady system is under-converged.
    - Molecular-only wall gradients disagree with transport-model integrated wall heat flow.
  validation:
    - 要求 Mesh OK、正常结束、重构字段有限、终止 residual 呈下降趋势，并且 local 与 cumulative continuity 可接受。
    - 在临时副本上使用 Foundation wallHeatFlux 积分 Q，检查封闭域冷热壁热平衡。
