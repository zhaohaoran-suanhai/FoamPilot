applicability:
  conditions:
    - 问题需要可压缩浮力、重力、传热与热力学密度耦合。
    - 任务使用 buoyantFoam 支持的稳态或瞬态 PIMPLE 推进方式。
  not_applicable:
    - 密度为常数且温度不与动量耦合时不适用。
