tags: [buoyantfoam, natural-convection, p_rgh, komega-sst, wall-heat]
applicability:
  conditions:
    - Compressible buoyancy, gravity, heat transfer, and thermodynamic density coupling are required.
    - The task uses steady or transient PIMPLE bookkeeping supported by buoyantFoam.
  not_applicable:
    - Density is constant and temperature does not couple to momentum.
