models: [conjugate-heat-transfer, fluid, solid, multiregion, PIMPLE]
tags: [chtmultiregionfoam, cht, multiregion, splitmeshregions, regionproperties, interface]
applicability:
  conditions:
    - Foundation v10 chtMultiRegionFoam couples one or more fluid regions with one or more solid heat-conduction regions.
    - A parent mesh is partitioned into named regions or compatible region meshes already exist.
  not_applicable:
    - The problem is single-region heat transfer or uses a different multi-region solver.
