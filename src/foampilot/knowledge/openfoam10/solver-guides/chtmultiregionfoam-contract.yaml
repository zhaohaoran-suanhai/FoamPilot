applicability:
  conditions:
    - Foundation v10 chtMultiRegionFoam 将一个或多个流体区域与一个或多个固体导热区域耦合。
    - 父网格被划分为具名区域，或兼容的区域网格已存在。
  not_applicable:
    - 问题是单区域传热，或使用其他多区域求解器时不适用。
