content:
  summary: Foundation v10 chtMultiRegionFoam 包含全局多区域控制，以及逐区域 scheme、solver、材料模型、字段和守恒耦合 interface patch。
  rules:
    - 在 constant/regionProperties 中列出所有 fluid 与 solid 名称，并保证这些名称在 constant/<region>、system/<region>、0/<region> 以及 constant/<region>/polyMesh 网格中完全一致。
    - Foundation v10 按 cell zone 划分父网格时，使用 splitMeshRegions -cellZones -defaultRegionName <name> -overwrite；-defaultRegion 不是有效 v10 选项。
    - 同时提供全局 system/fvSolution 和每个 system/<region>/fvSolution。全局文件负责多区域 PIMPLE loop，各区域文件负责其 field solver 与区域 PIMPLE 控制；区域文件不能替代全局文件。
    - 为每个区域提供 system/<region>/fvSchemes。fluid scheme 必须覆盖流体 formulation 选择的精确 momentum、energy、turbulence 与 pressure operator；solid scheme 必须覆盖其能量方程及瞬态或稳态模式。
    - 可压缩 fluid region 在 divSchemes default none 下，应包含 pressure-density regex 项 div(phi,(p|rho))，以及精确的 momentum、energy、turbulence 和 viscous-stress 项。
    - 在 system/<fluid>/fvSolution 中，除 p_rgh、p_rghFinal、velocity、energy 与 turbulence solver 外，还要显式提供 rho 和 rhoFinal diagonal solver 项；多区域 fluid loop 在压力修正时会查找 density final 项。
    - 将各区域的 physicalProperties、transport、radiation、fvModels、fvConstraints 与初始字段放入对应区域目录。每个 fluid region 还需要 constant/<fluid>/g，即使其值是 (0 0 0)；根目录 constant/g 不能满足区域查找。
    - 求解前盘点 fluid turbulence model 并写出完整区域字段集。k-omega fluid 除 U、p、p_rgh 与 energy variable 外，通常需要 0/<fluid>/k、0/<fluid>/omega、0/<fluid>/nut 和 0/<fluid>/alphat；k-epsilon fluid 用 epsilon 替代 omega，但仍需要 nut 和 alphat。每个字段都必须覆盖 split 后实际区域 patch 名。
    - 每个区域 radiationProperties dictionary 都使用 Foundation v10 selector key radiationModel。关闭 radiation 时写 radiationModel none；看似旧式的 radiation off 不会选择模型。
    - 对使用给定定容比热的 Foundation v10 常数各向同性 solid thermo package，使用 transport constIsoSolid、thermo eConst、energy sensibleInternalEnergy、specie 中 nMoles 1 和 Cv；constIso 与 solid hConst 不是已注册 Foundation v10 组合。即使写出的 T 为正，省略 nMoles 也可能破坏初始 sensible-energy 到 temperature 的转换。
    - 均匀体积固体热源放在 constant/<solid>/fvModels 中，使用 type heatSource、selectionMode all 与单位 W/m3 的 q；select all 不是 Foundation v10 selection key。
    - splitMeshRegions 后检查 constant/<region>/polyMesh/boundary，并按实际 patch 名编写每个区域字段。两侧 mapped-wall 温度界面都使用 Foundation v10 类型 compressible::turbulentTemperatureCoupledBaffleMixed，设置 Tnbr T，并在对应侧使用 fluidThermo 或 solidThermo kappaMethod；未限定名称的 turbulentTemperatureCoupledBaffleMixed 未注册。
    - 使用根 system/controlDict 控制时间步与输出。deltaT、maxCo、maxDi 和 maxDeltaT 必须同时与 fluid Courant 与 solid diffusion 限制一致。将 maxCo 与 maxDi 视为上限而非目标；若固体加热导致 energy-to-temperature 反演或负温度，在保持要求 end time 与输出的同时减小 maxDi 或 maxDeltaT。
    - 对尚未用网格与材料尺度证明稳定的加热固体，初始采用 `maxDi <= 1`，并让 maxDeltaT 允许求解器真正满足该限制；不得用 maxDi 200 之类宽松值掩盖固体扩散数。只有在独立稳定性证据支持时才逐步放宽。
    - 划分前验证父网格，调用 chtMultiRegionFoam 前确认区域创建成功。Foundation v10 checkMesh 没有 -allRegions 选项；需要区域网格检查时，对每个 fluid/solid region 分别执行一次 checkMesh -region <name>。若要求并行，所有区域必须一致分解，且 launcher 仍由 Runner 负责。
  failure_signals:
    - splitMeshRegions rejects -defaultRegion and lists -defaultRegionName.
    - chtMultiRegionFoam cannot find system/fvSolution even though regional fvSolution files exist.
    - Startup cannot find a regional fvSchemes, fvSolution, physicalProperties, field, or generated interface patch.
    - Coupled temperature patches report incompatible neighbor fields or conductivity methods.
    - A mappedWall interface reports Unknown patchField type turbulentTemperatureCoupledBaffleMixed and lists the compressible-qualified type.
    - Solid thermo compilation reports Unknown transport type constIso and lists constIsoSolid.
    - Solid thermo compilation reports Unknown thermo type hConst and lists eConst.
    - Solid startup reports a negative initial temperature although 0/<solid>/T is positive because the specie dictionary omitted nMoles 1.
    - Startup cannot find constant/<fluid>/g after both region meshes are created.
    - Fluid startup cannot find 0/<fluid>/nut or 0/<fluid>/alphat even though k and omega or epsilon were written.
    - A regional radiationProperties dictionary reports radiationModel undefined because it contains radiation off.
    - heatSource reports that selectionMode is undefined because select all was used.
    - Fluid startup reports missing rho, rhoFinal, or div(phi,(p|rho)) after both regional meshes and thermodynamics load.
    - A strong solid source reaches a negative temperature after several steps while the reported solid diffusion number is near an overly permissive maxDi cap.
    - checkMesh rejects -allRegions as an invalid option before chtMultiRegionFoam can start.
  validation:
    - 要求父网格有效，预期区域与界面非空，求解正常推进到要求时刻，fluid 与 solid 温度字段有限。
    - 在不使用目标算例解的前提下，检查界面热平衡、能量对源项的响应、fluid continuity 以及任务给定的温度或速度指标。
