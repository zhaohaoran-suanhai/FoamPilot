tags: [compressibleinterfoam, multiphase, vof, thermo, phase-fraction]
applicability:
  conditions:
    - 两种可压缩、非等温、不混溶流体需要瞬态 VOF 界面捕获。
  not_applicable:
    - 两相均可视为不可压缩等温流体时优先使用 interFoam。
