  conditions:
    - Foundation v10 electrostaticFoam 求解与输运电荷密度耦合的电势。
    - 算例提供 phi、rho、介电常数与电荷输运迁移率。
  not_applicable:
    - 任务需要磁流体或外部耦合电磁求解器时不适用。
