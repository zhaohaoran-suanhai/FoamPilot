content:
  summary: Foundation v10 electrostaticFoam 从 physicalProperties 读取具名 dimensioned scalar，求解电势，并随时间输运电荷密度。
  rules:
    - 提供电势量纲为 [1 2 -3 0 0 -1 0] 的 volScalarField phi，以及电荷密度量纲为 [0 -3 1 0 0 1 0] 的 rho。
    - physicalProperties 使用带重复内部名称的原生 dimensionedScalar stream 形式，例如 epsilon0 epsilon0 [-1 -3 4 0 0 2 0] <value> 和 k k [-1 0 2 0 0 1 0] <value>。若只写 epsilon0 [dimensions] <value> 或 k [dimensions] <value>，reader 会期待 word 并在左方括号处失败。
    - 提供 laplacian(phi) 与 div(rhoFlux,rho) scheme，并为输运 rho 方程使用支持非对称矩阵的 solver。
    - 施加电压处使用 fixed electric potential；同时使用兼容的 charge-density condition，symmetry plane 使用 symmetry，二维挤出跨距面使用 empty。
  failure_signals:
    - physicalProperties reports wrong token type, expected word, at epsilon0 or k.
    - Startup cannot read phi, rho, epsilon0, k, laplacian(phi), or div(rhoFlux,rho).
    - Charge transport uses a symmetric-only linear solver despite its advective operator.
  validation:
    - 要求 Mesh OK、在要求 final time 正常结束，且写出的 phi 与 rho 字段有限。
    - 若 run 只完成电势求解却没有推进电荷密度方程，应判定失败。
