content:
  summary: Foundation v10 electrostaticFoam reads named dimensioned scalars from physicalProperties, solves potential, and transports charge density in time.
  rules:
    - Provide volScalarField phi with electric-potential dimensions [1 2 -3 0 0 -1 0] and rho with charge-density dimensions [0 -3 1 0 0 1 0].
    - physicalProperties uses the native dimensionedScalar stream form with a repeated internal name, for example epsilon0 epsilon0 [-1 -3 4 0 0 2 0] <value>; and k k [-1 0 2 0 0 1 0] <value>. Writing only epsilon0 [dimensions] <value> or k [dimensions] <value> makes the reader expect a word and fail on the opening bracket.
    - Provide laplacian(phi) and div(rhoFlux,rho) schemes plus an asymmetric-capable solver for the transported rho equation.
    - Use fixed electric potential where voltage is imposed, compatible charge-density conditions, symmetry on symmetry planes, and empty on spanwise faces of a two-dimensional extrusion.
  failure_signals:
    - physicalProperties reports wrong token type, expected word, at epsilon0 or k.
    - Startup cannot read phi, rho, epsilon0, k, laplacian(phi), or div(rhoFlux,rho).
    - Charge transport uses a symmetric-only linear solver despite its advective operator.
  validation:
    - Require Mesh OK, normal completion at the requested final time, and finite written phi and rho fields.
    - Reject a run that only completes the potential solve but does not advance the charge-density equation.
