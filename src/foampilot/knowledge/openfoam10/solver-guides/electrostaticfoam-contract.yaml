applicability:
  conditions:
    - Foundation v10 electrostaticFoam solves electric potential coupled to transported charge density.
    - The case provides phi, rho, dielectric permittivity, and charge-transport mobility.
  not_applicable:
    - The task requires a magnetohydrodynamic or externally coupled electromagnetic solver.
