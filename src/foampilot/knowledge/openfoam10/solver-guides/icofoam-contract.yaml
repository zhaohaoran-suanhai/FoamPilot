schema_version: 1.0.0
id: of10.solver.icofoam-contract
title: icoFoam 瞬态不可压缩层流契约
fork: foundation
version: "10"
knowledge_type: solver_guide
solvers: [icoFoam]
models: [incompressible, laminar, transient]
tags: [icofoam, transient, incompressible, laminar, newtonian, velocity, kinematic-pressure]
applicability:
  conditions:
    - 流体为不可压缩、层流、等温且瞬态。
    - 每个 mesh patch 上都定义了速度 U 与运动压力 p。
  not_applicable:
    - 需要可压缩、湍流、多相、浮力或稳态物理时不适用。
source:
  kind: official_source
  title: OpenFOAM Foundation v10 icoFoam application
  locator: OpenFOAM-10/applications/solvers/incompressible/icoFoam/icoFoam.C
  sha256: 96538945ea4170a24ef356863904a745fa68b586e489b33ac0b6cbd8f8954641
  license_spdx: GPL-3.0-or-later
leakage:
  visibility: public
  families: []
  contains_target_case_solution: false
content:
  summary: icoFoam 使用 PISO 耦合随时间推进层流不可压缩速度与运动压力。
  rules:
    - 使用瞬态 controlDict 和正 deltaT。
    - 提供 physicalProperties、U、p、fvSchemes、fvSolution 与有效网格。
    - 所选 PISO corrector sequence 要求最终压力求解时，除 p 外还要定义兼容的 pFinal solver 项。
    - 若要求的物理需要其他 solver family，应拒绝该契约。
  failure_signals:
    - Required field U or p cannot be read.
    - The solver requests pFinal but fvSolution defines only p.
    - The requested physics is not incompressible laminar transient flow.
  validation:
    - 验证编写的 application 与 dictionary 符合 Foundation v10 icoFoam 语义。
    - 要求 solver 正常结束并达到要求的 final time。
