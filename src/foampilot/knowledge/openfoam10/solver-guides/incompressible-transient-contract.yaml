title: pisoFoam 与 pimpleFoam 瞬态不可压缩启动契约
fork: foundation
version: "10"
knowledge_type: solver_guide
solvers: [pisoFoam, pimpleFoam]
models: [incompressible, transient, laminar, ras, piso, pimple]
tags: [pisofoam, pimplefoam, transient, incompressible, momentum, viscous-stress]
applicability:
  conditions:
    - Foundation v10 pisoFoam 或 pimpleFoam 推进不可压缩速度-压力系统。
    - 算例使用层流或 RAS 动量输运以及运动压力。
  not_applicable:
    - 密度、能量、相分数或固体位移是主要耦合方程时不适用。
