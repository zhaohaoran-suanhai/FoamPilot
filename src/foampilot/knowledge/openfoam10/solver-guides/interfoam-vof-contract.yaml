schema_version: 1.0.0
id: of10.solver.interfoam-vof-contract
title: interFoam incompressible two-fluid VOF contract
fork: foundation
version: "10"
knowledge_type: solver_guide
solvers: [interFoam]
models: [incompressible, isothermal, immiscible, vof, transient]
tags: [interfoam, multiphase, vof, free-surface]
applicability:
  conditions:
    - Two incompressible isothermal immiscible fluids require transient interface capture.
    - A phase-fraction field, velocity, and reduced pressure are defined on every patch.
  not_applicable:
    - The fluids are miscible, compressible, or require resolved phase change.
