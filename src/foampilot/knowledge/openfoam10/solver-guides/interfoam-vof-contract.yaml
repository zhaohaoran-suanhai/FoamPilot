title: interFoam 不可压缩两流体 VOF 契约
fork: foundation
version: "10"
knowledge_type: solver_guide
solvers: [interFoam]
models: [incompressible, isothermal, immiscible, vof, transient]
tags: [interfoam, multiphase, vof, free-surface]
applicability:
  conditions:
    - 两种不可压缩、等温、不混溶流体需要瞬态界面捕获。
    - 每个 patch 都定义了相分数字段、速度和缩减压力。
  not_applicable:
    - 流体可混溶、可压缩或需要解析相变时不适用。
