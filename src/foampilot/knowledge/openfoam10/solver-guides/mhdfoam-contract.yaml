title: mhdFoam 不可压缩磁流体契约
fork: foundation
version: "10"
knowledge_type: solver_guide
solvers: [mhdFoam]
models: [incompressible, transient, laminar, magnetohydrodynamic, MHD, PISO, BPISO]
tags: [mhdfoam, mhd, hartmann, magnetic, permeability, conductivity, bpiso, pb]
applicability:
  conditions:
    - Foundation v10 mhdFoam 求解与磁场耦合的层流不可压缩导电流动。
    - 算例提供速度 U、磁场 B、运动压力 p 和磁压力 pB。
  not_applicable:
    - 物理问题需要可压缩、湍流、无感应或电势 formulation 时不适用。
