models: [incompressible, transient, laminar, magnetohydrodynamic, MHD, PISO, BPISO]
tags: [mhdfoam, mhd, hartmann, magnetic, permeability, conductivity, bpiso, pb]
applicability:
  conditions:
    - Foundation v10 mhdFoam solves laminar incompressible conducting flow coupled to a magnetic field.
    - The case supplies velocity U, magnetic field B, kinematic pressure p, and magnetic pressure pB.
  not_applicable:
    - The physics requires compressible, turbulent, inductionless, or electric-potential formulations.
