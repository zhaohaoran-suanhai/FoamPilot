content:
  summary: Foundation v10 mhdFoam 分别运行流体 PISO 与磁场 BPISO 修正 loop，并直接读取四个 dimensioned constant 以及 U、B、p 和 pB。
  rules:
    - 在 constant/physicalProperties 中使用重复名称的 dimensioned-scalar stream 形式：rho rho [1 -3 0 0 0 0 0]、nu nu [0 2 -1 0 0 0 0]、mu mu [1 1 -2 0 0 -2 0] 和 sigma sigma [-1 -3 3 0 0 2 0]，随后写入各自数值。
    - 提供可读取的 U、B、p 和 pB 字段，并在每个 mesh patch 上使用内部一致的 boundary condition。
    - 在 fvSolution 中配置完整耦合集 p、pFinal、pB、pBFinal、U、B 与 BFinal，并同时提供 PISO 和 BPISO dictionary；BPISO 控制磁压力修正 loop，不能从 PISO 推断。"(U|B).*" 等 regex 项可以覆盖 base 与 final vector solve，但两个 pressure-final alias 仍需显式给出。
    - 当 divSchemes/default 为 none 时，定义完整 Foundation v10 耦合 divergence 集：div(phi,U)、div(phiB,U)、div(phi,B) 与 div(phiB,((2*DBU)*B))。任一压力字段没有 fixed-value 锚点时，保留有效 pressure reference。将这四项视为一个 solver-family 契约，不能每遇到一次启动失败才补一个缺失 key。
    - 明确区分磁导率 mu 与动力黏度；mhdFoam 将 nu 读取为运动黏度，将具有不同量纲的 mu 读取为电磁常数。
  failure_signals:
    - Startup reports that BPISO is undefined in fvSolution.
    - physicalProperties reports rho, nu, mu, or sigma as undefined or dimensionally inconsistent.
    - A solver entry for pFinal, pBFinal, B, or BFinal is missing when a final correction begins.
    - fvSchemes reports div(phiB,U), div(phi,B), or the Lorentz-coupling divergence as undefined.
  validation:
    - 要求 Mesh OK、正常推进至要求时刻，且 U、B、p 与 pB 有限。
    - 在不泄漏 golden 的前提下，检查流体通量守恒、磁场 divergence 行为以及要求的 Hartmann 或 magnetic profile。
