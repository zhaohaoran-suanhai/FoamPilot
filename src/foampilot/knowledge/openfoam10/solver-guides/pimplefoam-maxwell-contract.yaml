id: of10.solver.pimplefoam-maxwell-contract
title: pimpleFoam transient laminar Maxwell and body-force contract
fork: foundation
version: "10"
knowledge_type: solver_guide
solvers: [pimpleFoam]
models: [incompressible, transient, laminar, Maxwell, viscoelastic, PIMPLE, semiImplicitSource]
tags: [pimplefoam, maxwell, viscoelastic, stress, sigma, fvmodels, semiimplicitsource, body-force]
applicability:
  conditions:
    - Foundation v10 pimpleFoam advances an incompressible transient flow with the laminar Maxwell momentum-transport model.
    - A uniform or selected-cell body force may be supplied through semiImplicitSource.
  not_applicable:
    - The task uses Newtonian laminar transport without an extra stress field.
    - The body force is imposed through a pressure gradient or another model type.
