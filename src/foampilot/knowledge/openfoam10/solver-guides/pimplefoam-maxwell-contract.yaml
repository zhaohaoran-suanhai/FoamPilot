content:
  summary: Foundation v10 pimpleFoam 使用层流 Maxwell 模型输运附加应力字段 sigma，并需要模型专用 divergence scheme；semiImplicitSource 使用 selectionMode 选择 cell，并声明显式与隐式源项系数。
  rules:
    - 提供 U、p、sigma、physicalProperties、momentumTransport、fvSchemes、fvSolution、controlDict，以及任务要求的 fvModels 或 fvConstraints dictionary，并保证 patch 覆盖一致。
    - 在 divSchemes default none 下，Maxwell family 要求精确项 div(phi,U)、div(phi,sigma)、div(sigma)、div((nu*dev2(T(grad(U))))) 与 div((nuM*grad(U)))。不得以 Newtonian nuEff key 替代，也不得省略 base-viscosity stress key。
    - 使用 nuM 与 lambda 配置 laminar MaxwellCoeffs，并通过与速度约束一致的 boundary condition 保持 sigma 字段有限。
    - 强耦合瞬态 Maxwell 基线中，div(phi,sigma) 使用 Gauss vanAlbada 等有界应力对流 scheme；同时配置 "(U|sigma)" 与 "(U|sigma)Final" solver coverage；设置 momentumPredictor off，并在 pressure corrector 前使用多个 nOuterCorrectors。仅将应力对流改为 upwind 不能替代所需 outer coupling。
    - Foundation v10 semiImplicitSource 使用 selectionMode，例如 selectionMode all，而不是 select。显式设置 volumeMode，并声明包含显式 vector 项和隐式 scalar 项的 U source 子字典；紧凑 U (((vector) scalar)) primitive 形式与该 reader 不兼容。
    - 对周期性或其他无锚点压力字段，使用 PIMPLE dictionary 和有效 pressure reference。
  failure_signals:
    - fvModels reports that selectionMode is undefined because select was used.
    - fvModels tries to return sources/U as a sub-dictionary because a compact primitive source tuple was used.
    - fvSchemes reports div((nu*dev2(T(grad(U))))) or another Maxwell stress divergence as undefined.
    - The sigma field is missing, has incompatible patches, or becomes non-finite because the transient stress and momentum equations were under-coupled.
  validation:
    - 要求 Mesh OK、正常推进至要求时刻，且 U、p 和 sigma 有限。
    - 检查周期或边界流量平衡，并独立比较要求的瞬态速度或应力观测量。
