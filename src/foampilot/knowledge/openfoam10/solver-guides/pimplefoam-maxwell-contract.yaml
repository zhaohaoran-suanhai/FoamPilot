id: of10.solver.pimplefoam-maxwell-contract
title: pimpleFoam 瞬态层流 Maxwell 与体力源项契约
fork: foundation
version: "10"
knowledge_type: solver_guide
solvers: [pimpleFoam]
models: [incompressible, transient, laminar, Maxwell, viscoelastic, PIMPLE, semiImplicitSource]
tags: [pimplefoam, maxwell, viscoelastic, stress, sigma, fvmodels, semiimplicitsource, body-force]
applicability:
  conditions:
    - Foundation v10 pimpleFoam 使用层流 Maxwell 动量输运模型推进不可压缩瞬态流动。
    - 可以通过 semiImplicitSource 施加均匀或选定 cell 的体力。
  not_applicable:
    - 任务使用不含附加应力字段的 Newtonian 层流输运时不适用。
    - 体力通过压力梯度或其他 model type 施加时不适用。
