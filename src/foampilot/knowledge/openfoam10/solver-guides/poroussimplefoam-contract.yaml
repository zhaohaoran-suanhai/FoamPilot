applicability:
  conditions:
    - Foundation v10 porousSimpleFoam 求解一个或多个 porous cell zone 中含阻力的稳态不可压缩流动。
    - Darcy 与 Forchheimer 阻力系数及其局部坐标轴已知。
  not_applicable:
    - 任务需要可压缩、瞬态、变形或未解析孔隙尺度流动时不适用。
