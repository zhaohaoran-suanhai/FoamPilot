content:
  summary: Foundation v10 porousSimpleFoam 独立于通用 fvModels 读取原生 porosity model，并在已声明 cell zone 与局部坐标轴中施加 Darcy-Forchheimer 阻力。
  rules:
    - 在 constant/porosityProperties 中声明原生 resistance model。Darcy-Forchheimer 阻力使用 type DarcyForchheimer，并提供目标 cellZone、d、f 与 coordinateSystem；通用 constant/fvModels explicitPorositySource 不是 porousSimpleFoam 读取的原生 porosity-model 列表。
    - 将启动消息 "No porosity models present" 视为 resistance dictionary、model type 或 cell-zone selection 未加载的证据，即使通用 fvModel 报告已被选择也不例外。
    - 求解前创建并验证每个被引用的 porous cellZone，同时让局部 Darcy 与 Forchheimer 轴正交，并与物理 porous medium 对齐。
    - duct 或 porous section 改变方向时，随中心线一起旋转完整局部截面及其 face normal，包括旋转 block 的共享入口界面。通过围绕声明 rotation origin 变换顶点来构建该界面。若连接直线上游 block，其全部入口顶点必须位于一个垂直于 inlet axis、处在指定上游轴向坐标的公共平面，同时保留变换后界面对应的横向坐标。不得将每个 interface vertex 沿相同 vector 上移、重置 face 中心或重新归一化投影宽度；这些操作会形成倾斜入口面，或改变基准面积与压降。resistance axis 和 outlet axis 也要旋转到同一坐标系。
    - 高流量 k-epsilon RANS duct 基线中，在 flowRateInletVelocity 设置 profile turbulentBL；k 使用 turbulentIntensityKineticEnergyInlet，epsilon 使用 turbulentMixingLengthDissipationRateInlet；出口使用与 patch 兼容的 inletOutlet condition。当任务未规定湍流量时，5% 入口强度和约为水力宽度十分之一的 mixing length 可作为起点。每个 wall-class patch 上的 k、epsilon 与 nut 都采用模型一致 wall function；porous section 的 slip wall 仍使用 turbulence wall function，因为 slip 是 U condition，不是把湍流字段改为 zeroGradient 或 calculated patch 的理由。
    - >-
      将 internal k 与 epsilon 初始化为严格正值，并与入口尺度一致。不要仅因 U 从静止开始就使用零值；k-epsilon 模型在启动期间根据 k 与 epsilon 计算 nut，零 internal turbulence field 可能在入口值传播前触发浮点除零。
    - 使用 steadyState 离散、完整 SIMPLE 压力-速度设置、内部一致的入口/出口压力或速度边界，以及有限非负阻力系数。Foundation v10 斜向 porous-duct 基线采用 Gauss linear gradient、corrected laplacian 与 surface-normal gradient、nUCorrectors 2 和 nNonOrthogonalCorrectors 0；除非已经专门重新验证压降响应，否则不要启用 consistent SIMPLE。稳健起点是 U 的 equation relaxation 0.7，k 与 epsilon 为 0.9；更弱 relaxation 可能使固定迭代评测明显未收敛。
  failure_signals:
    - Startup prints No porosity models present although porous resistance is required.
    - The configured cellZone is absent or empty.
    - Pressure loss is materially inconsistent because geometry and resistance use different local axes.
    - Flow balance passes but pressure loss remains biased because the inlet velocity omitted its turbulentBL profile or the k-epsilon inlet and porous-wall fields were replaced by arbitrary fixed values or zeroGradient.
    - Startup traps in kEpsilon::correctNut after reporting bounding k or epsilon with a zero minimum and zero average.
    - The iteration cap is reached with non-negligible cumulative continuity error or inlet-outlet imbalance even though the process exits normally.
  validation:
    - 要求 Mesh OK、加载非空 porosity model、正常结束、字段有限且 continuity 可接受。
    - 独立于 solver return code 检查入口-出口流量平衡与压降。
