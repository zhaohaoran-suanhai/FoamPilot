tags: [poroussimplefoam, porous, darcyforchheimer, resistance, cellzone, coordinatesystem]
applicability:
  conditions:
    - Foundation v10 porousSimpleFoam solves steady incompressible flow with resistance in one or more porous cell zones.
    - Darcy and Forchheimer resistance coefficients and their local coordinate axes are known.
  not_applicable:
    - The task requires compressible, transient, deforming, or unresolved pore-scale flow.
