title: potentialFoam 不可压缩速度势契约
fork: foundation
version: "10"
knowledge_type: solver_guide
solvers: [potentialFoam]
models: [incompressible, inviscid, potential-flow, steady]
tags: [potentialfoam, potential, phi, velocity, pressure]
applicability:
  conditions:
    - 要求的流动不可压缩、无旋，并可由速度势充分表示。
    - 网格以及一致的速度与压力边界条件定义了通量问题。
  not_applicable:
    - 需要黏性分离、湍流、可压缩性或时间分辨物理时不适用。
