content:
  summary: potentialFoam 求解速度势方程、修正通量并重构 U；无需时间 loop，也可以选择写出势和近似压力字段。
  rules:
    - 提供 U、p、fvSchemes、带 potentialFlow 非正交 corrector dictionary 的 fvSolution、controlDict 和有效网格。
    - 为速度势设置 reference；要求写出压力时，还要设置一致 pressure reference。
    - 需要势时请求 -writePhi，压力字段是 required output 时请求 -writep。使用 -writep 时还要在 fvSolution 中为 p 配置 linear solver；近似压力计算不会复用 Phi solver。
    - 在 divSchemes default none 下使用 -writep 时，同时提供 div(phi,U) 与 div(div(phi,U))；Foundation v10 通过嵌套 divergence operation 构造近似压力。
    - 将写出结果视为单个稳态，不得虚构瞬态收敛语义。
    - 无黏固体边界使用 slip 或 symmetry，并保持入口/出口 U 与 p condition 的通量兼容性。
  failure_signals:
    - Phi or its reference cannot be created.
    - The -writep calculation reaches approximate pressure and reports that the p solver is undefined.
    - U is reconstructed but required p or Phi output is absent because the corresponding option was omitted.
    - The result completes but inlet/outlet flux or an analytical potential-flow invariant fails.
  validation:
    - 要求 Mesh OK、正常 End、U 与 p 有限，并写出任务要求的字段。
    - 检查通量平衡；存在公开解析不变量时，将采样速度与其比较。
