content:
  summary: rhoCentralFoam 使用根据可压缩热力学状态与声波速度构造的 central-upwind flux 推进密度、动量和能量。
  rules:
    - 提供包含内部一致 psi 热力学模型与 energy variable 的 physicalProperties，以及 momentumTransport、U、p、T、fvSchemes、fvSolution、controlDict 和有效网格。
    - 只有公开任务明确为无黏时才使用零黏度，并让 laminar momentum model 与该假设一致。
    - 将间断面与 mesh face 对齐；几何一维算例的横向 patch 使用 empty。
    - 在 fvSolution 中使用 "(rho|rhoU|rhoE)" solver 项匹配 Foundation v10 守恒方程名称，并为派生场提供 "(U|e)" 项；原生显式模式两组均使用 solver diagonal。U/e 不能替代守恒场条目，但某些边界更新会按派生场名查找 solver；两组都提供可避免推进到首步后才报告 U 或 e undefined。
    - rhoCentralFoam 显式构造 tauMC 并调用 fvc::div(tauMC)；当 divSchemes/default 为 none 时，必须提供 `div(tauMC) Gauss linear;`（或经验证兼容的显式替代），仅写 div(phi,U) 与 div(phi,e) 不完整。
    - 对采用 waveTransmissive 的边界，提供与热力学状态一致的 gamma scalar；对标量字段，`fieldInf must be a scalar literal`：写 `fieldInf 300;`，不能写 `fieldInf uniform 300;`；lInf 同样是裸 scalar。`value` 才使用 `uniform <scalar>` field syntax。
    - 使用 adjustTimeStep 和正 maxCo 控制 Courant；deltaT 是初始步长，需要自适应增长时 maxDeltaT 必须大于 deltaT。
    - startTime 为零时使用 timeFormat general，保证名为 0 的初始目录仍可读取；保留足够 timePrecision 以区分较短的自适应输出时刻。
  failure_signals:
    - fvSchemes reports div(tauMC) undefined at the first momentum/energy update.
    - waveTransmissive reports expected Scalar but found the word uniform in fieldInf or lInf.
    - waveTransmissive reports gamma undefined, or the first time step reports U/e undefined in fvSolution after conserved fields solve.
    - The thermodynamic package, energy field, density, or transport model is inconsistent or unreadable.
    - fvSolution reports rho, rhoU, or rhoE as undefined because only derived-field solver entries were provided.
    - maxDeltaT equals deltaT and prevents requested adaptive growth.
    - The run ends normally but mass, actual Courant history, or public wave propagation is inaccurate.
  validation:
    - 要求 Mesh OK、间断初始化成功、正常结束、达到要求 final time、热力学字段有限且质量守恒。
    - 将瞬态波位置与公开解析或网格细化证据比较，而不是与目标算例坐标比较。
