solvers: [rhoCentralFoam]
models: [compressible, transient, central-upwind, perfect-gas]
tags: [rhocentralfoam, compressible, shock, thermodynamics, courant]
applicability:
  conditions:
    - 瞬态可压缩流动包含强密度、压力变化或波传播。
    - 适合采用基于密度的 central-upwind scheme，且热力学状态已完整给定。
  not_applicable:
    - 要求的问题不可压缩，或为不含可压缩波动力学的稳态问题时不适用。
