title: rhoCentralFoam compressible central-upwind contract
fork: foundation
version: "10"
knowledge_type: solver_guide
solvers: [rhoCentralFoam]
models: [compressible, transient, central-upwind, perfect-gas]
tags: [rhocentralfoam, compressible, shock, thermodynamics, courant]
applicability:
  conditions:
    - A transient compressible flow contains strong density, pressure, or wave propagation.
    - A central-upwind density-based scheme is appropriate and the thermodynamic state is fully specified.
  not_applicable:
    - The requested problem is incompressible or steady without compressible wave dynamics.
source:
  kind: official_source
  title: OpenFOAM Foundation v10 rhoCentralFoam application
  locator: OpenFOAM-10/applications/solvers/compressible/rhoCentralFoam/rhoCentralFoam.C
