solvers: [rhoPimpleFoam]
models: [compressible, transient, laminar, Stokes, PIMPLE]
tags: [rhopimplefoam, compressible, laminar, stokes, energy, rho, pimple]
applicability:
  conditions:
    - Foundation v10 rhoPimpleFoam 使用层流动量输运模型推进瞬态可压缩流动。
    - 任务使用标准黏性应力，而不是黏弹性本构模型。
  not_applicable:
    - 任务需要不可压缩求解器、湍流或非 Stokes 层流本构模型时不适用。
