content:
  summary: Foundation v10 rhoPimpleFoam 通过 PIMPLE 耦合可压缩动量、热力学能量与压力；其标准层流 runtime model 是 Stokes，而不是 Newtonian。
  rules:
    - 标准可压缩层流黏性流动在 constant/momentumTransport 中设置 simulationType laminar 和 model Stokes。Newtonian 不是已注册的 Foundation v10 可压缩 laminarModel type。
    - 提供内部一致的 U、p、T 或所选 energy variable、热物性 physicalProperties、momentumTransport、fvSchemes、fvSolution 与 controlDict。
    - 在 divSchemes default none 下覆盖 div(phi,U)、所选能量对流项（如 div(phi,e) 或 div(phi,h)）、div(phi,K)、pressure-density regex key div(phi,(p|rho))，以及精确黏性应力 key div(((rho*nuEff)*dev2(T(grad(U)))))。
    - 为 rho/rhoFinal、p/pFinal、U/UFinal 以及所选 energy field/其 Final 项配置显式 solver entry；即使 rho 使用 diagonal solver，Foundation v10 rhoPimpleFoam 仍会在最后 outer corrector 中查找 rhoFinal。
    - linear solver 与 preconditioner 必须匹配运行时判定的矩阵类型。symmetric matrix 的 pressure 路径使用其注册的 DIC、FDIC、GAMG、diagonal 或 none 等兼容选择；DILU 只用于已注册的 asymmetric matrix 路径，不能复制到 symmetric pressure entry。若日志输出 valid-list，只定向修复该 field entry，不同时改 thermo 或物理边界。
    - pressure dimension 与 thermophysical energy form 必须与所选 fluid thermo package 一致，并选择适合可压缩传播与输运的 deltaT 或自适应 Courant 控制。
    - 启动前用公开状态关系核对 p、T、rho 与所选 energy 的一致性和正值；matrix compatibility 通过后再调整 Courant、格式或松弛。
  failure_signals:
    - Startup reports Unknown laminarModel type Newtonian and lists Stokes among the valid types.
    - fvSolution reports that rhoFinal is undefined in solvers after model and field construction succeeds.
    - fvSolution reports Unknown symmetric matrix preconditioner DILU and lists DIC/FDIC or other symmetric alternatives.
    - fvSchemes reports a missing compressible viscous-stress or energy-convection operator.
    - fvSchemes reports that div(phi,(p|rho)) is undefined after all thermophysical models were constructed.
    - physicalProperties, momentumTransport, rho, p, U, or the selected energy field is unreadable or dimensionally inconsistent.
  validation:
    - 要求 Mesh OK、正常推进到要求时刻、primitive 与热力学字段有限且守恒可接受。
    - 在不泄漏目标算例的前提下，检查任务给定的压力、温度、密度、速度、质量或能量观测量。
