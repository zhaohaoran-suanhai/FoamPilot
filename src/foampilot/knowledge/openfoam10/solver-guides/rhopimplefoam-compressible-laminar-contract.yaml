schema_version: 1.0.0
id: of10.solver.rhopimplefoam-compressible-laminar-contract
title: rhoPimpleFoam compressible laminar contract
fork: foundation
version: "10"
knowledge_type: solver_guide
solvers: [rhoPimpleFoam]
models: [compressible, transient, laminar, Stokes, PIMPLE]
tags: [rhopimplefoam, compressible, laminar, stokes, energy, rho, pimple]
applicability:
  conditions:
    - Foundation v10 rhoPimpleFoam advances transient compressible flow with a laminar momentum-transport model.
    - The task uses the standard viscous stress rather than a viscoelastic constitutive model.
  not_applicable:
    - The task requires an incompressible solver, turbulence, or a non-Stokes laminar constitutive model.
source:
  kind: official_source
  title: OpenFOAM Foundation v10 rhoPimpleFoam and Stokes momentum model sources
  locator: OpenFOAM-10 applications/solvers/compressible/rhoPimpleFoam plus src/MomentumTransportModels momentumTransportModels/laminar/Stokes
  sha256: 80a67d4a9190e9e4561305b8a06464bced7380fc870768c3ed6e23ac0c43e5fc
  license_spdx: GPL-3.0-or-later
leakage:
  visibility: public
  families: []
  contains_target_case_solution: false
content:
  summary: Foundation v10 rhoPimpleFoam couples compressible momentum, thermodynamic energy, and pressure with PIMPLE; its standard laminar runtime model is Stokes rather than Newtonian.
  rules:
    - For standard compressible laminar viscous flow, set simulationType laminar and model Stokes in constant/momentumTransport. Newtonian is not a registered Foundation v10 compressible laminarModel type.
    - Provide coherent U, p, T or the selected energy variable, thermophysical physicalProperties, momentumTransport, fvSchemes, fvSolution, and controlDict.
    - Under divSchemes default none, cover div(phi,U), the selected energy convection term such as div(phi,e) or div(phi,h), div(phi,K), the pressure-density regex key div(phi,(p|rho)), and the exact viscous-stress key div(((rho*nuEff)*dev2(T(grad(U))))).
    - Configure explicit solver entries for rho and rhoFinal, p and pFinal, U and UFinal, and the selected energy field and its Final entry; Foundation v10 rhoPimpleFoam looks up rhoFinal during the final outer corrector even when rho uses a diagonal solver.
    - Keep pressure dimensions and thermophysical energy form consistent with the selected fluid thermo package, and choose deltaT or adaptive Courant controls appropriate to compressible propagation and transport.
  failure_signals:
    - Startup reports Unknown laminarModel type Newtonian and lists Stokes among the valid types.
    - fvSolution reports that rhoFinal is undefined in solvers after model and field construction succeeds.
    - fvSchemes reports a missing compressible viscous-stress or energy-convection operator.
    - fvSchemes reports that div(phi,(p|rho)) is undefined after all thermophysical models were constructed.
    - physicalProperties, momentumTransport, rho, p, U, or the selected energy field is unreadable or dimensionally inconsistent.
  validation:
    - Require Mesh OK, normal completion through the requested time, finite primitive and thermodynamic fields, and acceptable conservation.
    - Check task-derived pressure, temperature, density, velocity, mass, or energy observables without target-case leakage.
