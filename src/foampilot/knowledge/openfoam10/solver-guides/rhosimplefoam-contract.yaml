applicability:
  conditions:
    - Foundation v10 rhoSimpleFoam solves steady compressible flow with thermodynamics and optional RAS turbulence.
    - The primary pressure is dimensional thermodynamic pressure.
  not_applicable:
    - The flow is incompressible or uses a transient compressible solver.
