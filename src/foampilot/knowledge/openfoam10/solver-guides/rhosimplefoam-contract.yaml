content:
  summary: Foundation v10 rhoSimpleFoam 需要有量纲热力学字段、可压缩湍流输运，以及完整稳态压力-速度-能量离散。
  rules:
    - 提供 physicalProperties、momentumTransport、U、p、T、所选 RAS model 要求的每个 turbulence field、alphat、fvSchemes、fvSolution、controlDict 和所有已声明 fvConstraint。
    - 使用压力量纲 [1 -1 -2 0 0 0 0]、速度 [0 1 -1 0 0 0 0]、温度 [0 0 0 1 0 0 0]、k [0 2 -2 0 0 0 0]、epsilon [0 2 -3 0 0 0 0]、nut [0 2 -1 0 0 0 0] 与可压缩 alphat [1 -1 -1 0 0 0 0]。只修改 alphat patch type 不能修复错误 field dimension。
    - 使用所选模型要求的可压缩 alphat wall function，并声明 turbulent Prandtl number。
    - 在 divSchemes/default none 下加入 div(phi,U)、所选能量项（如 div(phi,h)）、div(phi,K)、div(phid,p)、输运 turbulence 项与 div(((rho*nuEff)*dev2(T(grad(U)))))。
    - 以相对 factor 指定的 limitPressure fvConstraint 使用精确 key minFactor 与 maxFactor。不得用绝对 min/max 项替代 factor key。
    - 可压缩 flowRateInletVelocity 质量流量边界需要入口密度估计和 turbulent boundary-layer profile 时，若任务要求这些语义，应显式提供 rhoInlet 与 profile turbulentBL。
    - 为 p、U、energy 与 turbulence 配置 SIMPLE control 和 relaxation。高通量可压缩 duct 基线中，Foundation v10 使用 transonic yes 与 consistent yes；p 使用带 DILU 的 GAMG；U、焓与湍流使用带 DILU 的 PBiCGStab；采用 corrected surface-normal/laplacian scheme 和内部一致 equation relaxation。将 residualControl 视为收敛 gate，而不是完整 dictionary 的替代。
    - 高难高速 bend 或 duct 先为 U、焓、k、epsilon 与 kinetic energy 使用 bounded Gauss upwind，再考虑高阶对流。已验证 Foundation v10 稳态启动基线使用 field relaxation p 1，U、焓、k、epsilon 的 equation relaxation 0.9；保守基线稳定前，不要同时引入 linearUpwind/limitedLinear 与明显更弱 relaxation。
  failure_signals:
    - Startup reports addition of dynamic transport dimensions [1 -1 -1 0 0 0 0] and kinematic dimensions [0 2 -1 0 0 0 0].
    - alphat uses kinematic dimensions or an incompressible wall-function type.
    - fvSchemes reports a missing energy, pressure, kinetic-energy, turbulence, or viscous-stress divergence entry.
    - Pressure or enthalpy diverges within early steady iterations and thermodynamics aborts on a negative reconstructed temperature.
    - A factor-based pressure limiter is written with min and max instead of minFactor and maxFactor.
  validation:
    - 要求 Mesh OK、正常结束、U、p、T、density、turbulence 与 alphat 字段有限，并提供任务给定的 residual 与 conservation 证据。
    - 若 run 只到达迭代上限且压力或温度不物理，应判定失败。
