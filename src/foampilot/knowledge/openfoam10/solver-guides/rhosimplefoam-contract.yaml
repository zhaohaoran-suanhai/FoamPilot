applicability:
  conditions:
    - Foundation v10 rhoSimpleFoam 求解包含热力学和可选 RAS 湍流的稳态可压缩流动。
    - 主压力是有量纲热力学压力。
  not_applicable:
    - 流动不可压缩或使用瞬态可压缩求解器时不适用。
