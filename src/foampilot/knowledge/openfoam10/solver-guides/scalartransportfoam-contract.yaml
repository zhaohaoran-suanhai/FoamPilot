solvers: [scalarTransportFoam]
models: [incompressible, passive-scalar, transport, steady, transient]
tags: [scalartransportfoam, passive-scalar, scalar, transport, diffusivity, simple]
applicability:
  conditions:
    - A prescribed incompressible velocity field transports a passive scalar.
    - Scalar diffusion is represented by one constant diffusivity.
  not_applicable:
    - The scalar changes density, momentum, or another solved flow property.
    - Species reactions, compressibility, or tensor diffusivity are required.
