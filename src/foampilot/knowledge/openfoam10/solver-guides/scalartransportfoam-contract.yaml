content:
  summary: Foundation v10 scalarTransportFoam 使用 simpleControl 与常数扩散率 DT，求解给定 U 和 flux phi 对字段 T 的稳态或瞬态输运。
  rules:
    - 提供可读取的 T 与 U 字段，并在每个 mesh patch 上使用通量兼容 boundary condition。
    - 将 dimensioned scalar DT 放在 constant/physicalProperties 中，使用 stream 形式 DT DT [0 2 -1 0 0 0 0] value；Foundation v10 dimensionedScalar lookup 要求重复名称。application 不会从 constant/transportProperties 读取该输入。
    - 在 system/fvSolution 中提供 SIMPLE dictionary，因为 application 在读取字段前就构造 simpleControl，即使 ddtSchemes 选择瞬态离散也一样。
    - 对流项 div(phi,T) 通常使 T 方程成为非对称矩阵。使用支持非对称矩阵的 linear solver；Foundation v10 scalar-transport 模式使用带 DILU 的 PBiCGStab。带 DIC 的 PCG 只适用于对称系统，scalar advection 激活时会被拒绝。
    - 在 system/fvSchemes 中定义 div(phi,T) 与 laplacian(DT,T)；瞬态输运还要使用非 none 的 ddt scheme。
    - scalarTransportFoam 前提供有限的给定速度。公开任务需要时，可由独立原生 initialization solver 生成 U 与 phi。
    - 通过 controlDict 控制标量积分区间；正常 End 是执行证据，而不是标量守恒证明。
  failure_signals:
    - Startup reports that SIMPLE is undefined in system/fvSolution.
    - Startup cannot find constant/physicalProperties or cannot look up DT.
    - fvSchemes reports div(phi,T) or laplacian(DT,T) as undefined.
    - The T solve reports Unknown asymmetric matrix solver PCG because fvSolution selected a symmetric-only solver or preconditioner.
    - T or U is missing, has uncovered patches, or becomes non-finite.
  validation:
    - 要求网格有效；任务要求时速度初始化成功；正常结束并达到 final time；T 与 U 有限。
    - 根据公开计算域与 boundary condition 检查 scalar inventory 或 boundary balance。
    - 存在解析或独立冻结 reference 时，将下游 scalar profile 与其比较。
