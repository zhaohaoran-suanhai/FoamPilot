applicability:
  conditions:
    - Foundation v10 shallowWaterFoam advances water depth and depth-integrated momentum over a prescribed bed.
    - The task supplies shallow-water gravity, rotation, initial depth, bed height, and momentum.
  not_applicable:
    - The task requires a three-dimensional free surface, VOF interface capture, or compressible flow.
