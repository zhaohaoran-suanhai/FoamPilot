content:
  summary: Foundation v10 shallowWaterFoam 读取床面高度 h0、水深 h、深度积分动量 hU、总深度 hTotal、旋转重力数据与 PIMPLE 控制。
  rules:
    - 使用 constant/gravitationalProperties，而不是 constant/g。Foundation v10 dimensioned-vector lookup 同时要求 dictionary key 与 dimensioned value name，例如 g g [0 1 -2 0 0 0 0] (0 0 -9.81) 和 Omega Omega [0 0 -1 0 0 0 0] (0 0 7.292e-5)；省略第二个名称会使 dimensions token 无效。声明 rotating true 或 false，启用旋转时包含 Omega。
    - 提供具有长度量纲的 0/h0 与 0/h、具有面积每时间量纲的 0/hU，以及具有长度量纲和 calculated patch value 的 0/hTotal。一致覆盖每个 mesh patch；hTotal 属于启动 field inventory，不只是可选后处理。
    - 将 h0 视为静态输入字段。Foundation v10 从最近可用 mesh-time instance 发现它，并绑定为 const field；h0 不会自动写入每个 output time。验证或保留编写的 h0 输入本身；只有 h、hU、U 与 hTotal 等演化或自动写出字段才要求 time-directory 输出。
    - 床面特征具有区域分布时，使用 setFields 同时初始化 h0、h 与 hU，保证给定总自由表面状态和动量一致。
    - 提供包含 nOuterCorrectors、nCorrectors、nNonOrthogonalCorrectors 与 momentumPredictor 的 PIMPLE dictionary；只有 solvers dictionary 不完整。
    - 提供 h、hFinal、hU 与 hUFinal linear-solver 项。Foundation v10 基线中 h 使用带 DIC 的 PCG，hU 使用 smoothSolver；final 项继承 base 设置并采用零 relative tolerance。
    - 在 divSchemes default none 下加入精确动量输运项 div(phiv,hU)。Foundation v10 square-bump 基线采用 Gauss LUST un、CrankNicolson 0.9 时间离散，以及 uncorrected laplacian 与 surface-normal scheme。
    - 全程保持水深为正、hU 有限，并让时间步与浅水波速及对流速度一致。
  failure_signals:
    - Startup reports that PIMPLE is undefined in system/fvSolution.
    - Startup cannot find constant/gravitationalProperties even though constant/g exists.
    - Reading gravitationalProperties expects a word but encounters the opening dimensions bracket because g or Omega lacks its dimensioned value name.
    - Startup cannot read h0, h, hU, hTotal, hFinal, hUFinal, or div(phiv,hU).
    - setFields changes the bed height without consistently updating water depth and depth-integrated momentum.
  validation:
    - 要求 Mesh OK、初始化成功、正常推进到要求时刻、必需字段有限且水深为正。
    - 同时检查水深与动量守恒，以及任务给定自由表面或波动观测量。
