applicability:
  conditions:
    - 要求的流动为稳态、不可压缩且湍流。
    - 已指定 RANS closure 及其入口和壁面 boundary condition。
  not_applicable:
    - 存在可压缩性、多相流或必需瞬态行为时不适用。
