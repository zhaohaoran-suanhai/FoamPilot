content:
  summary: simpleFoam iterates the steady incompressible momentum and pressure equations with SIMPLE coupling and updates the selected viscosity and momentum-transport models.
  rules:
    - Provide physicalProperties, momentumTransport, U, p, every turbulence field required by the selected RANS model, fvSchemes, fvSolution, controlDict, and a valid mesh.
    - Use steadyState time discretization and a SIMPLE dictionary with a valid pressure reference when pressure has no fixed-value anchor.
    - Use one coherent wall-function set for the selected high- or low-Reynolds-number closure; do not mix k, epsilon or omega, and nut conditions from unrelated models.
    - Configure relaxation for stable convergence and keep enough iteration and write budget to preserve a final state; add residualControl only when early stopping is explicitly needed.
    - When MPI is used, decompose before solving, use executable simpleFoam with mpi_ranks on that typed command, and reconstruct before evaluator sampling; never embed mpirun or orterun because the Runner owns the launcher.
  failure_signals:
    - A turbulence field or model coefficient dictionary is missing.
    - A wall function is incompatible with the selected RANS closure or patch type.
    - End is reached only because the iteration cap is exhausted while residuals, continuity, or flow balance remain poor.
  validation:
    - Require Mesh OK, normal solver completion, finite fields, and a reconstructed latest state.
    - Check residual trends, continuity, inlet/outlet flow balance, and requested pressure or velocity observables independently.
