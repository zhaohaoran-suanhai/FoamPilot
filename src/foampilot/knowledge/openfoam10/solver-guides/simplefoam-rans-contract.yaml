content:
  summary: simpleFoam 使用 SIMPLE 耦合迭代稳态不可压缩动量与压力方程，并更新所选黏度和动量输运模型。
  rules:
    - 提供 physicalProperties、momentumTransport、U、p、所选 RANS model 要求的所有 turbulence field、fvSchemes、fvSolution、controlDict 与有效网格。
    - 使用 steadyState 时间离散；压力无 fixed-value 锚点时，在 SIMPLE dictionary 中提供有效 pressure reference。
    - Foundation v10 高 Reynolds 数分离流基线使用 SIMPLE consistent yes、有界 linearUpwind 速度对流 scheme、k 与 epsilon 的 bounded limitedLinear 1 对流，以及约 0.9 的 equation relaxation。在改用更耗散 upwind 输运或更弱 relaxation 前，将这些设置视为一组内部一致的收敛基线。
    - divSchemes/default 为 none 时，加入精确 Foundation v10 黏性应力项 div((nuEff*dev2(T(grad(U)))))；否则 simpleFoam 即使成功加载 turbulence model，也会在第一次动量组装时失败。
    - 为所选高或低 Reynolds 数 closure 使用一组内部一致 wall function；不得混用无关模型的 k、epsilon/omega 与 nut condition。
    - 配置 relaxation 以稳定收敛，并保留足够 iteration 与 write budget 以保存最终状态；只有明确需要提前停止时才添加 residualControl。
    - 使用 MPI 时，求解前 decompose；在 typed command 中以 executable simpleFoam 与 mpi_ranks 运行；evaluator 采样前 reconstruct。绝不能嵌入 mpirun 或 orterun，因为 launcher 由 Runner 负责。
  failure_signals:
    - A turbulence field or model coefficient dictionary is missing.
    - A wall function is incompatible with the selected RANS closure or patch type.
    - fvSchemes reports div((nuEff*dev2(T(grad(U))))) as undefined.
    - End is reached only because the iteration cap is exhausted while residuals, continuity, or flow balance remain poor; a normal exit at that cap is not convergence.
  validation:
    - 要求 Mesh OK、solver 正常结束、字段有限且 latest state 已重构。
    - 分别检查 residual trend、continuity、入口/出口流量平衡以及任务要求的压力或速度观测量。
