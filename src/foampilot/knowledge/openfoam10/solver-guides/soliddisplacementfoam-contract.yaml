  families: []
  contains_target_case_solution: false
content:
  summary: Foundation v10 solidDisplacementFoam 通过 solidDisplacementThermo 读取材料属性，并按精确 operator name 选择二阶时间导数、位移 Laplacian 与显式应力 scheme。
  rules:
    - 在 constant/physicalProperties 中，将 rho、E、nu、Cp、kappa 与 alphav 定义为包含 type uniform 和 scalar value 的子字典，或使用带可读取 field 的 type field；不得把这些项写成 primitive dimensioned scalar。
    - 显式设置 planeStress 与 thermalStress。即使是非热计算，也要提供内部一致的 Cp、kappa、alphav 与 T 数据，因为 thermo object 在位移 loop 前构造这些属性。
    - 提供可读取 vector displacement field D。受载或无 traction 边界使用带 traction 与 pressure 项的 tractionDisplacement；几何 symmetry patch 使用兼容的 field type；二维 empty 跨距使用 empty。
    - 在 system/fvSchemes 中提供独立 d2dt2Schemes dictionary，并使用精确 key d2dt2(rho,D)；伪时间稳态迭代选择 steadyState，真实瞬态任务选择受支持 second-derivative scheme。ddtSchemes 项不能满足该查找。
    - 定义 laplacian(DD,D)，因为隐式位移方程按该名称查找 scheme；compactNormalStress 使用具名显式应力 divergence 时还要定义 div(sigmaD)。
    - 在 fvSolution 中为 D 配置 solver，并提供包含 compactNormalStress、可选 nCorrectors 和 scalar D 收敛容差的 stressAnalysis 子字典。Foundation v10 读取字面名称 stressAnalysis，而不是以 solidDisplacementFoam 命名的控制字典。
    - solver 在 write time 写出 sigma 与 sigmaEq。只有位移求解产生 sigma 后，才为额外要求的分量运行原生 postProcess。
  failure_signals:
    - physicalProperties reports an attempt to return a primitive entry as a sub-dictionary.
    - fvSchemes.d2dt2Schemes reports that d2dt2(rho,D) is undefined.
    - Startup reports that laplacian(DD,D), div(sigmaD), D, planeStress, or thermalStress is undefined.
    - fvSolution reports stressAnalysis or stressAnalysis/compactNormalStress as undefined.
  validation:
    - 要求 Mesh OK、正常推进至要求 iteration 或 time，且 D、sigma 与 sigmaEq 有限。
    - 在不暴露目标算例解的前提下，检查边界 displacement/traction 行为、symmetry，以及任务给定应力或位移指标。
