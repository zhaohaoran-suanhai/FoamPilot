tags: [soliddisplacementfoam, solid-mechanics, displacement, stress, d2dt2, traction]
applicability:
  conditions:
    - Foundation v10 solidDisplacementFoam solves transient or steady linear-elastic small-strain displacement D with optional thermal stress.
    - Material properties are uniform values or fields understood by solidDisplacementThermo.
  not_applicable:
    - The problem requires finite strain, plasticity, contact, nonlinear material behavior, or a different solid-mechanics solver.
