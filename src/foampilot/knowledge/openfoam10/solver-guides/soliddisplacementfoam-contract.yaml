schema_version: 1.0.0
id: of10.solver.soliddisplacementfoam-contract
title: solidDisplacementFoam 线弹性位移契约
fork: foundation
version: "10"
knowledge_type: solver_guide
solvers: [solidDisplacementFoam]
models: [solid, linear-elastic, small-strain, displacement, planeStress, thermalStress]
tags: [soliddisplacementfoam, solid-mechanics, displacement, stress, d2dt2, traction]
applicability:
  conditions:
    - Foundation v10 solidDisplacementFoam 求解瞬态或稳态线弹性小应变位移 D，并可选耦合热应力。
    - 材料属性为 solidDisplacementThermo 能识别的均匀数值或字段。
  not_applicable:
    - 问题需要有限应变、塑性、接触、非线性材料行为或其他固体力学求解器时不适用。
