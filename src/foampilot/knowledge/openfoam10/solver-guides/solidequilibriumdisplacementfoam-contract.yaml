applicability:
  conditions:
    - Foundation v10 solidEquilibriumDisplacementFoam solves steady small-strain linear elasticity with displacement corrections.
    - Material behavior is supported by solidDisplacementThermo.
  not_applicable:
    - The task requires transient inertia, plasticity, contact, finite strain, or nonlinear material behavior.
