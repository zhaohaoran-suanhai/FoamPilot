content:
  summary: Foundation v10 solidEquilibriumDisplacementFoam 使用显式组合应力 divergence 与 solver-specific stressAnalysis 控制，迭代 D 和 Dcorr。
  rules:
    - 提供 D、T、physicalProperties、fvSchemes、fvSolution 与 controlDict。材料属性 rho、E、nu、Cp、kappa 与 alphav 使用 solidDisplacementThermo 要求的子字典形式。
    - solidDisplacementThermo 直接读取 physicalProperties 的 top-level Cp dictionary，结构必须是 `Cp { type uniform; value <J/kg/K>; }`；`mixture/thermodynamics/Cp` 属于通用 mixture thermo，不能替代这个顶层属性。同样以顶层 uniform/field 子字典提供 rho、kappa、E、nu 与 alphav。
    - 受载或自由面使用包含 traction、pressure 与 value 的 tractionDisplacement；受约束面使用 fixedValue；并配置内部一致的 empty 或 symmetry condition。
    - 稳态平衡求解器定义 d2dt2Schemes/default steadyState；除非有效 default 能同时覆盖，否则分别提供 laplacian(DD,D) 与 laplacian(DD,Dcorr) 的精确 laplacianSchemes 项；并提供精确显式 divergence key div((sigmaExp+sigmaD))。
    - 为 D 与 Dcorr 配置 solver，并提供 stressAnalysis dictionary，其中包含 convergence tolerance D、需要时的 nCorrectors，以及与材料 Poisson ratio 兼容的 accelerationFactor。
    - 所选 executable 请求组合 equilibrium operator 时，不得复用仅适用于 solidDisplacementFoam 的 div(sigmaD) 等 scheme name。
  failure_signals:
    - physicalProperties reports Cp, kappa, E, nu, or alphav undefined when the value was placed only under a generic mixture dictionary.
    - fvSchemes reports div((sigmaExp+sigmaD)) as undefined.
    - fvSchemes reports laplacian(DD,D) or laplacian(DD,Dcorr) as undefined.
    - fvSolution cannot find Dcorr or required stressAnalysis controls.
    - Traction boundaries cannot construct because traction, pressure, or value is missing.
  validation:
    - 要求 Mesh OK、正常结束、D 与 stress field 有限，并满足任务给定 constraint 与 traction 行为。
    - 在不复制目标算例解的前提下，用公开物理关系检查位移或应力。
