applicability:
  conditions:
    - Foundation v10 solidEquilibriumDisplacementFoam 通过位移修正求解稳态小应变线弹性。
    - 材料行为受 solidDisplacementThermo 支持。
  not_applicable:
    - 任务需要瞬态惯性、塑性、接触、有限应变或非线性材料行为时不适用。
