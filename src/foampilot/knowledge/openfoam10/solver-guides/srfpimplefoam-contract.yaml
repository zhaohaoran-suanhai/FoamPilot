content:
  summary: Foundation v10 SRFPimpleFoam 在单一旋转参考系中推进相对速度 Urel，因此 field name、SRF freestream boundary、viscous-stress scheme key 与 PIMPLE 控制都必须采用 SRF 专用语义。
  rules:
    - 提供 SRFProperties、physicalProperties、momentumTransport、Urel、p、必需 turbulence field、fvSchemes、fvSolution 与 controlDict，并将 application 设置为 SRFPimpleFoam。
    - 惯性 freestream 上，Urel 使用 SRFFreestreamVelocity；UInf 采用 UInf (1 0 0) 等 vector syntax，而不是 UInf uniform (1 0 0)；patch 初始化为 value uniform (0 0 0)。不要把 UInf 复制到 value，否则初始通量可能表现为有 specified inflow 却无 adjustable outflow。圆形远场包围的外部 rotor 使用 p zeroGradient、pRefCell 与 pRefValue；k 和 epsilon 使用带 inletValue 的 inletOutlet，这是内部一致的 Foundation v10 SRF far-field 组合。只有物理上确实需要开放压力边界时才使用 freestreamPressure，并同时提供 freestreamValue 与 value。
    - 在 divSchemes default none 下提供 div(phi,Urel) 与精确 Foundation v10 stress key div((nuEff*dev2(T(grad(Urel)))))，以及所选 closure 要求的 transported turbulence-field 项。
    - 瞬态外部 rotor RANS 基线中，div(phi,Urel) 使用 Gauss limitedLinearV 1，k 与 epsilon 使用 Gauss limitedLinear 1。若没有任务专用精度研究，这些 bounded limited scheme 比直接替换为 upwind 或 linearUpwind 更能保持官方 SRF far-field 行为。
    - 为 Urel 与 p（而不是 U）配置 PIMPLE solver 和 control，并通过 freestream pressure boundary 或 reference 保持有效压力锚点。用 "Urel.*"、"k.*"、"epsilon.*" 等 regex solver key 或等价显式 Final alias 覆盖 final iteration lookup。
    - 任务指定固定 deltaT 时，设置 adjustTimeStep no；maxCo 仍只是被监测的稳定性限制，不代表允许改变要求的时间步。
    - 为所选 RANS model 使用内部一致的 rotor-wall Urel 与 turbulence wall function。
  failure_signals:
    - freestreamPressure reports that freestreamValue is undefined.
    - SRFFreestreamVelocity expects a vector for UInf but reads the word uniform.
    - adjustPhi reports specified inflow with no adjustable outflow because the SRF freestream value was initialized to UInf instead of zero.
    - fvSchemes reports div((nuEff*dev2(T(grad(Urel))))) as undefined because a U-based or Newtonian key was used.
    - fvSolution has a solver entry for U but not Urel.
  validation:
    - 要求 Mesh OK、正常结束、Urel 与 pressure/turbulence 字段有限，并达到要求 final time。
    - 独立检查全局流量平衡与旋转坐标系速度观测量。
