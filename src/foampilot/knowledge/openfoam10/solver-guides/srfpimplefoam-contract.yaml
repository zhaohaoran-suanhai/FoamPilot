title: SRFPimpleFoam 单旋转坐标系瞬态契约
fork: foundation
version: "10"
knowledge_type: solver_guide
solvers: [SRFPimpleFoam]
models: [incompressible, transient, rotating-frame, SRF, PIMPLE, RANS]
tags: [srfpimplefoam, srf, rotor, rotating, urel, freestream, pimple]
applicability:
  conditions:
    - 整个计算域都在一个旋转参考系中表达。
    - Foundation v10 SRFPimpleFoam 使用 PIMPLE 耦合求解相对速度 Urel。
  not_applicable:
    - 只有子区域旋转，或任务需要 MRF/sliding-mesh interface 时不适用。
    - 求解器推进绝对速度 U 而不是 Urel 时不适用。
