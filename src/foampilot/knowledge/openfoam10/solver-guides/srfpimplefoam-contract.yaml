id: of10.solver.srfpimplefoam-contract
title: SRFPimpleFoam single-rotating-frame transient contract
fork: foundation
version: "10"
knowledge_type: solver_guide
solvers: [SRFPimpleFoam]
models: [incompressible, transient, rotating-frame, SRF, PIMPLE, RANS]
tags: [srfpimplefoam, srf, rotor, rotating, urel, freestream, pimple]
applicability:
  conditions:
    - The entire computational domain is expressed in one rotating reference frame.
    - Foundation v10 SRFPimpleFoam solves relative velocity Urel with PIMPLE coupling.
  not_applicable:
    - Only a subregion rotates or the task requires MRF or sliding-mesh interfaces.
    - The solver advances absolute U rather than Urel.
