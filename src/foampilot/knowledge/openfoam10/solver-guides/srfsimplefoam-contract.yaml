models: [incompressible, steady, ras, srf, rotating-frame]
tags: [srfsimplefoam, srf, rotating-frame, urel, simple, srfvelocity]
applicability:
  conditions:
    - Foundation v10 SRFSimpleFoam 在单一旋转参考系中求解稳态不可压缩流动。
    - 相对速度 Urel 与 SRFProperties 定义旋转坐标系 formulation。
  not_applicable:
    - 坐标系瞬态运动、多个 mesh region 旋转，或任务使用 MRF/dynamic-mesh solver 时不适用。
