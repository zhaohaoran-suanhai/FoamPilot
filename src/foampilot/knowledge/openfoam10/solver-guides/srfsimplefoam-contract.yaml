content:
  summary: Foundation v10 SRFSimpleFoam 在 decomposition 或 solution 前读取 Urel、SRFProperties、稳态 SIMPLE 控制与旋转坐标系 boundary field。
  rules:
    - 提供包含一个 model、origin、非零 axis 及其 coefficient 的 SRFProperties；提供 Urel，而不是 U。
    - 每个 type SRFVelocity patch 都必须包含 inletValue、relative 与 value。入口和壁面均如此；静止惯性壁面使用 inletValue uniform (0 0 0)、relative no 和已初始化 value。
    - 使用 pressureInletOutletVelocity 或其他压力兼容出口速度、一个 pressure reference 或 fixed pressure，以及与所选 RAS model 兼容的 turbulence field。
    - 在 divSchemes/default none 下提供 div(phi,Urel)、transported turbulence 项与 div((nuEff*dev2(T(grad(Urel)))))。
    - 使用 MPI 时，在 decomposePar 前提供有效 decomposeParDict，以 typed mpi_ranks 运行 SRFSimpleFoam，并 reconstruct 已接受字段。
  failure_signals:
    - decomposePar or the solver reports inletValue, relative, or value missing from an SRFVelocity patch.
    - The executable cannot find Urel or SRFProperties.
    - fvSchemes reports a U-based rather than Urel-based momentum or viscous-stress operator.
  validation:
    - 要求 Mesh OK；并行时 decomposition 成功；正常结束并完成 reconstruction；Urel、p 与 turbulence field 有限。
    - 根据任务几何检查入口与壁面速度的相对/惯性解释。
