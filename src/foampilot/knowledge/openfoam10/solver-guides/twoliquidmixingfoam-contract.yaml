applicability:
  conditions:
    - Foundation v10 twoLiquidMixingFoam transports the fraction of two incompressible miscible liquids.
    - Density and viscosity differ by phase and molecular diffusion is declared.
  not_applicable:
    - The phases are immiscible with a sharp VOF interface or have independent velocities.
