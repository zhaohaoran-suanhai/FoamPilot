content:
  summary: Foundation v10 twoLiquidMixingFoam 需要两个 phase property dictionary、有界 alpha field、缩减压力、重力、扩散控制，以及 flow/phase 两类 Courant 限制。
  rules:
    - 在 phaseProperties 中声明两个 phase name 与 diffusion coefficient，并为每相提供一个 physicalProperties.<phase> dictionary。
    - 提供 U、p_rgh、被输运 alpha.<phase> field、g、momentumTransport、fvSchemes 与 fvSolution；初始界面具有区域分布时还要提供原生 initialization step。
    - 在 divSchemes/default none 下写入精确 transported-fraction key div(phi,alpha)；即使磁盘 field 名为 alpha.<phase>，Foundation v10 twoLiquidMixingFoam 也查找这一通用 operator name。不得替换为 div(phi,alpha.<phase>)。
    - 使用自适应时间步时，controlDict 必须成对包含 maxCo 与 maxAlphaCo，并提供正 maxDeltaT。solver 直接读取 maxAlphaCo，只有 maxCo 不足。
    - 在 fvSolution 的 transported alpha.<phase> solver dictionary 中显式给出 nAlphaSubCycles 与 nAlphaCorr，并提供 scalar solver、smoother、tolerance 与 relTol。这些控制属于 alpha solver entry，不能只放在 PIMPLE 中。
    - 保持 p_rgh 量纲 [1 -1 -2 0 0 0 0]；封闭运动流体壁面使用 fixedFluxPressure；alpha boundary condition 与 phase 进入/流出保持一致。
    - 在 divSchemes/default none 下，使用精确 field group name 提供所有被请求 momentum、alpha、diffusion 与 viscous-stress operator。
  failure_signals:
    - Startup reports maxAlphaCo is undefined in controlDict.
    - A phase-specific physicalProperties dictionary or alpha field cannot be found.
    - fvSolution/solvers/alpha.<phase> reports nAlphaSubCycles or nAlphaCorr as undefined.
    - p_rgh uses kinematic-pressure dimensions instead of dynamic pressure.
  validation:
    - 要求初始化成功、Mesh OK、正常结束、U、p_rgh 与 alpha 有限，并通过任务给定 phase bound 与 inventory 检查。
    - 判断时间步是否充分时，同时使用 flow 与 phase Courant 证据。
