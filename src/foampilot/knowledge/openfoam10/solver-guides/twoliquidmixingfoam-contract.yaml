applicability:
  conditions:
    - Foundation v10 twoLiquidMixingFoam 输运两种不可压缩可混溶液体的组分比例。
    - 各相密度与黏度不同，并已声明分子扩散。
  not_applicable:
    - 各相不混溶并具有尖锐 VOF 界面，或具有独立速度时不适用。
