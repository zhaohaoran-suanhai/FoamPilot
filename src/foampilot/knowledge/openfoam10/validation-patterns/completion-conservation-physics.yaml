id: of10.validation.completion-conservation-physics
title: 分层求解器与物理验证
fork: foundation
version: "10"
knowledge_type: validation_pattern
solvers: []
models: [evidence-assessment]
tags: [completion, conservation, physics, verdict]
applicability:
  conditions:
    - OpenFOAM run 需要有证据支持的技术 verdict。
    - 公开检查必须与基准私有 golden 检查保持分离。
  not_applicable:
    - 没有 solver execution 或物理输出需要审查时不适用。
source:
  kind: reviewed_engineering
  title: FoamPilot native run assessment
  locator: src/foampilot/evidence/assessment.py
  sha256: 5f17b349be394b6066c71ea8641c3182a34cf807c7fd178489a04c2b94d9085c
  license_spdx: MIT
leakage:
  visibility: public
  families: []
  contains_target_case_solution: false
content:
  summary: 零 return code 只是一个 gate；completion、final time、有限值、守恒、问题专用物理与 artifact integrity 构成相互独立的证据层。
  rules:
    - 要求执行 return code、timeout、fatal-marker、normal-End 与 final-time 检查。
    - 独立于 shell success 记录 conservation；显式物理验收由下游 ResultReport 评估。
    - 私有 golden value 与 validator 必须位于 Agent-visible context 之外。
  failure_signals:
    - The verdict is PASS solely because the shell returned zero.
    - Missing or non-finite physics evidence is treated as success.
  validation:
    - 每项检查都记录 observed value、criterion 与 pass/fail result。
    - 报告 run 前验证 artifact manifest。
