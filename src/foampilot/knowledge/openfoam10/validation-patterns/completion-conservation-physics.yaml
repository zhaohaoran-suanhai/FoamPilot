leakage:
  visibility: public
  families: []
  contains_target_case_solution: false
content:
  summary: A zero return code is only one gate; completion, final time, finite values, conservation, problem-specific physics, and artifact integrity form separate evidence layers.
  rules:
    - Require return code, timeout, fatal-marker, normal-End, and final-time checks.
    - Evaluate conservation and public physics independently of shell success.
    - Keep private golden values and validators outside the Agent-visible context.
  failure_signals:
    - The verdict is PASS solely because the shell returned zero.
    - Missing or non-finite physics evidence is treated as success.
  validation:
    - Record every check with observed value, criterion, and pass/fail result.
    - Verify the artifact manifest before reporting the run.
