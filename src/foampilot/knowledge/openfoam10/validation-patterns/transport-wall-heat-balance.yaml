schema_version: 1.0.0
id: of10.validation.transport-wall-heat-balance
title: Transport-model wall heat-flow balance
fork: foundation
version: "10"
knowledge_type: validation_pattern
solvers: [buoyantFoam]
models: [thermophysical-transport, turbulent-heat-transfer]
tags: [wallheatflux, energy, convergence, turbulence]
applicability:
  conditions:
    - A completed fluid or solid heat-transfer result needs integrated wall heat-flow evidence.
    - The active thermophysical transport model may include turbulent or radiative heat flux.
  not_applicable:
    - No wall heat-transfer quantity is part of the physical acceptance criteria.
source:
  kind: official_source
  title: OpenFOAM Foundation v10 wallHeatFlux function object
  locator: OpenFOAM-10/src/functionObjects/field/wallHeatFlux/wallHeatFlux.C
  sha256: 9045c814bd0cd1810a9bdbc49476ecb009ac6cf422084b7ee2f0854e629fc76e
