schema_version: 1.0.0
id: of10.validation.transport-wall-heat-balance
title: 输运模型壁面热流平衡
fork: foundation
version: "10"
knowledge_type: validation_pattern
solvers: [buoyantFoam]
models: [thermophysical-transport, turbulent-heat-transfer]
tags: [wallheatflux, energy, convergence, turbulence]
applicability:
  conditions:
    - 已完成流体或固体传热结果需要积分壁面热流证据。
    - active thermophysical transport model 可能包含湍流或辐射热流。
  not_applicable:
    - 物理验收标准不包含任何壁面传热量时不适用。
source:
  kind: official_source
  title: OpenFOAM Foundation v10 wallHeatFlux function object
  locator: OpenFOAM-10/src/functionObjects/field/wallHeatFlux/wallHeatFlux.C
  sha256: 9045c814bd0cd1810a9bdbc49476ecb009ac6cf422084b7ee2f0854e629fc76e
  license_spdx: GPL-3.0-or-later
leakage:
  visibility: public
  families: []
  contains_target_case_solution: false
content:
  summary: Foundation wallHeatFlux 从 active thermophysical transport model 获取热流；存在已配置 radiation 时将其计入，并在每个 wall patch 上积分 Q。
  rules:
    - 使用积分 wallHeatFlux Q，而不是仅根据分子导热重构湍流热流。
    - 已完成 attempt 不可变时，在临时副本上运行 post-processing。
    - 将 energy balance 与 equation-residual、continuity trend 配合判断，因为正常 End line 不是收敛证明。
    - 使用较大的绝对积分热流归一化封闭域冷热壁不平衡量。
  failure_signals:
    - Wall heat rate is inferred only from first-cell temperature and molecular conductivity in a turbulent case.
    - Hot and cold integrated heat flows have the same sign or a large normalized imbalance.
    - Residual or local continuity evidence is absent at the accepted iteration.
  validation:
    - 记录 patch name、积分 Q、平均 q、audit time 与归一化不平衡量。
    - 分别保留 completion、convergence、continuity 与 energy-balance verdict。
