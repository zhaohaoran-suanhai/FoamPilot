leakage:
  visibility: public
  families: []
  contains_target_case_solution: false
content:
  summary: Foundation wallHeatFlux obtains heat flux from the active thermophysical transport model, includes configured radiation when present, and integrates Q over each wall patch.
  rules:
    - Use integrated wallHeatFlux Q rather than reconstructing turbulent heat flow from molecular conductivity alone.
    - Run post-processing on a temporary copy when the completed attempt is immutable.
    - Pair energy balance with equation-residual and continuity trends because a normal End line is not a convergence proof.
    - Normalize closed-domain hot/cold imbalance by the larger absolute integrated heat flow.
  failure_signals:
    - Wall heat rate is inferred only from first-cell temperature and molecular conductivity in a turbulent case.
    - Hot and cold integrated heat flows have the same sign or a large normalized imbalance.
    - Residual or local continuity evidence is absent at the accepted iteration.
  validation:
    - Record patch names, integrated Q, mean q, audit time, and normalized imbalance.
    - Preserve separate completion, convergence, continuity, and energy-balance verdicts.
