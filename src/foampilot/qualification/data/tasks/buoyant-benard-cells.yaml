schema_version: 3
task_id: buoyant-benard-cells
title: Rayleigh-Benard convection cells
openfoam_target:
  distribution: foundation
  version: '10'
resource_budget:
  max_attempts: 2
  max_wall_seconds: 1800
  max_mpi_ranks: 1
  memory_mib: 3072
required_outputs:
- mesh quality log
- completed buoyantFoam log
- U T p and p_rgh fields at 1000 s
public_assets: []
protected_paths: []
request_text: Starting from an empty case directory, build the Foundation v10 buoyantFoam
  Rayleigh-Benard cell benchmark. Use a two-dimensional box 9 m long and 1 m high,
  extruded from z=-1 to 1 m with empty front/back faces, and a 90 by 10 by 1 mesh.
  Preserve floor, ceiling, sideWalls, and frontAndBack. Use a perfect-gas buoyant
  formulation with gravity downward, standard air transport, and k-epsilon RANS fields
  compatible with the solver. Heat the floor, cool the ceiling, use adiabatic side
  walls, and initialize a small temperature perturbation that can seed convection.
  Maintain coherent p, p_rgh and pressure reference semantics. Run to 1000 s with
  deltaT=1 s and write every 50 s. Generate all native files, run blockMesh, checkMesh
  and buoyantFoam serially, and do not read or copy a pre-existing case.
acceptance_intent:
- checkMesh reports Mesh OK
- buoyantFoam reaches 1000 s and ends normally
- required fields remain finite
