schema_version: 2
task_id: buoyant-circuit-board-cooling
title: Steady buoyant cooling of heated circuit-board components
prompt: >-
  Starting from an empty case directory, build a three-dimensional natural
  convection enclosure representative of the Foundation OpenFOAM v10
  circuitBoardCooling case. Use a 0.3 m high, 0.2 m wide and 0.05 m deep box
  containing two rectangular heated component wall patches on one vertical
  board. Construct a conformal multi-block mesh with at least 25000 cells.
  Model buoyant perfect-gas air with gravity (0 -9.81 0), steady k-epsilon RANS,
  ambient temperature 300 K, component wall temperatures 330 K and 350 K, and
  adiabatic remaining walls. Use buoyantFoam with coherent p, p_rgh, pRef,
  U, T, k, epsilon, nut and alphat fields. Run blockMesh/checkMesh and solve
  through iteration 500. Generate every native file and do not copy a
  pre-existing tutorial.
openfoam_target: {distribution: foundation, version: "10"}
resource_budget: {max_attempts: 2, max_wall_seconds: 1800, max_mpi_ranks: 4, memory_mib: 4096}
required_outputs:
  - valid enclosure mesh and completed buoyantFoam log
  - final thermofluid and turbulence fields
acceptance_requirements:
  - checkMesh reports Mesh OK
  - buoyantFoam reaches iteration 500 and ends normally
  - pressure and temperature fields remain finite and positive
public_checks:
  - {name: mesh-quality, kind: mesh_ok, parameters: {}}
  - {name: target-solver, kind: command_executed, parameters: {executable: buoyantFoam}}
  - {name: normal-completion, kind: completion, parameters: {}}
  - {name: final-iteration, kind: final_time, parameters: {minimum: 500}}
  - {name: finite-fields, kind: finite_fields, parameters: {}}
public_assets: []
protected_paths: [/home/edwin/workplace/OpenFOAM-10/tutorials]
