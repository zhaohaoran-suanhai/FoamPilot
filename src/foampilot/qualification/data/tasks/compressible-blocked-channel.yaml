schema_version: 3
task_id: compressible-blocked-channel
title: Transient compressible flow through partially blocked channels
openfoam_target:
  distribution: foundation
  version: '10'
resource_budget:
  max_attempts: 2
  max_wall_seconds: 1800
  max_mpi_ranks: 1
  memory_mib: 4096
required_outputs:
- mesh quality and volume-fraction initialization logs
- completed rhoPimpleFoam log through 0.03 s
- pressure, temperature, density, velocity, and phase-temperature fields
- fields suitable for total-mass and primitive-profile evaluation
public_assets: []
protected_paths: []
request_text: 'Starting from an empty case directory, build and solve a two-dimensional
  laminar compressible benchmark with four disconnected channels, each 0.256 m long
  and 0.032 m high, extruded over 0.002 m with one empty spanwise cell. Place the
  channel bands at y=[-0.016,0.016], [-0.052,-0.020], [-0.088,-0.056], and [-0.124,-0.092]
  m. Use 256 by 32 cells for the straight first, third, and fourth channels. In the
  second channel use five streamwise blocks spanning x=0, 0.032, 0.064, 0.128, 0.224,
  and 0.256 m, with lower/upper boundaries changing from -0.052/-0.020 to -0.044/-0.028
  and back, and counts 32, 32, 32, 96, and 64 by 32. Preserve combined inlet, outlet,
  walls, and empty frontAndBack patches. Use rhoPimpleFoam with a laminar perfect
  gas of molecular weight 28.9 kg/kmol, Cv=712 J/(kg K), Cp=1005 J/(kg K), mu=1.8e-5
  Pa s, Pr=0.7, and sensible internal energy. Initialize U=(10 0 0) m/s, p=100000
  Pa, and T=300 K; impose T=400 K and the initial U at each inlet, p=100000 Pa at
  each outlet, no slip and adiabatic walls. Also initialize dimensionless alpha.volume
  in the third channel and alpha.solid in the fourth to half of a streamwise obstruction
  profile: zero before x=0.032, linear to 0.5 at x=0.064, constant to x=0.128, linear
  back to zero at x=0.224, and zero afterward. Couple the volume fraction to the fluid
  equations and the solid fraction to an equilibrium solid-energy model with rho=900
  kg/m3, Cv=1900 J/(kg K), and kappa=0.5 W/(m K), initialized at 300 K. Use a native
  field initialization command, integrate to 0.03 s from deltaT=0.0001 s with adaptive
  maxCo=5, and write every 0.001 s. Run serially. Generate all Foundation OpenFOAM
  v10 files yourself, run blockMesh and checkMesh, and do not read or copy a pre-existing
  case.'
acceptance_intent:
- checkMesh reports Mesh OK and volume-fraction initialization succeeds
- rhoPimpleFoam reaches 0.03 s and ends normally
- pressure, temperature, density, velocity, and volume fractions remain finite
- total mass and primitive profiles pass evaluator checks
