schema_version: 2
task_id: electrostatic-charged-wire
title: Electrostatic field around a charged wire
prompt: >-
  Starting from an empty case directory, build the Foundation v10
  electrostaticFoam charged-wire benchmark. Model one quarter of the region
  around a cylindrical wire of radius 0.001 m inside an outer square that
  reaches 0.076 m in x and 0.114 m in y, extruded 0.5 m. Use five conformal
  curved blocks, symmetry planes at x=0 and y=0, an outer patch, a wire
  patch, and empty axial faces. Grade the mesh radially away from the wire.
  Use epsilon0=8.85419e-12 in Foundation dimensions and mobility-like
  coefficient k=0.00016 in Foundation dimensions. Initialize rho and phi
  consistently, impose the official charged-wire/outer-boundary potential
  and charge conditions, run from 0 to 0.02 s with deltaT=5e-5 s and write
  every 100 steps. Generate every native file, run blockMesh, checkMesh and
  electrostaticFoam serially without reading or copying an existing case.
openfoam_target: {distribution: foundation, version: "10"}
resource_budget: {max_attempts: 2, max_wall_seconds: 900, max_mpi_ranks: 1, memory_mib: 2048}
required_outputs: [mesh quality log, completed electrostaticFoam log, phi and rho fields at 0.02 s]
acceptance_requirements: [checkMesh reports Mesh OK, electrostaticFoam reaches 0.02 s and ends normally, required fields remain finite]
public_checks:
  - {name: mesh-quality, kind: mesh_ok, parameters: {}}
  - {name: target-solver, kind: command_executed, parameters: {executable: electrostaticFoam}}
  - {name: normal-completion, kind: completion, parameters: {}}
  - {name: final-time, kind: final_time, parameters: {minimum: 0.02}}
  - {name: finite-fields, kind: finite_fields, parameters: {}}
  - {name: final-potential, kind: requested_output, parameters: {path: 0.02/phi}}
  - {name: final-charge, kind: requested_output, parameters: {path: 0.02/rho}}
public_assets: []
protected_paths: [/home/edwin/workplace/OpenFOAM-10/tutorials]
