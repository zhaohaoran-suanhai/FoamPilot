schema_version: 3
task_id: laminar-cavity-clipped
title: Clipped-corner lid-driven laminar cavity
openfoam_target:
  distribution: foundation
  version: '10'
resource_budget:
  max_attempts: 2
  max_wall_seconds: 600
  max_mpi_ranks: 1
  memory_mib: 2048
required_outputs:
- mesh quality log
- completed icoFoam log
- velocity and pressure fields at 0.6 s
public_assets: []
protected_paths: []
request_text: 'Starting from an empty case directory, build the clipped-corner variant
  of the Foundation OpenFOAM v10 lid-driven cavity. In metres, form a 0.1 by 0.1 two-dimensional
  cavity extruded 0.01 m, with the lower-right 0.04 by 0.04 corner removed. Use three
  conformal blocks: lower-left 12 by 8, upper-left 12 by 12, and upper-right 8 by
  12 cells, all one cell thick. Preserve lid, fixedWalls, and empty frontAndBack patches.
  Use icoFoam with nu=0.01 m2/s, initially zero U and p, lid velocity (1 0 0) m/s,
  deltaT=0.005 s, and run from 0 to 0.6 s with writes at 0.1 s. Generate all files,
  run blockMesh and checkMesh, and solve serially without reading or copying a pre-existing
  case.'
acceptance_intent:
- checkMesh reports Mesh OK
- icoFoam reaches 0.6 s and ends normally
- required fields remain finite
