schema_version: 1
task_id: laminar-cavity-graded
title: Graded-mesh lid-driven laminar cavity
prompt: >-
  Starting from an empty case directory, reproduce the graded-mesh variant
  of the Foundation OpenFOAM v10 lid-driven cavity benchmark. Use a 0.1 m by
  0.1 m two-dimensional square extruded 0.01 m, split into four equal blocks.
  Put 10 by 10 by 1 cells in each block and grade each block by a factor of
  two toward the outside walls. Preserve movingWall, fixedWalls, and empty
  frontAndBack patches. Use icoFoam, nu=0.01 m2/s, initially zero U and p,
  lid velocity (1 0 0) m/s, deltaT=0.0025 s, and run from 0 to 0.7 s with
  writes at 0.1 s. Generate every native file, run blockMesh and checkMesh,
  solve serially, and do not read or copy an existing tutorial.
openfoam_target: {distribution: foundation, version: "10"}
resource_budget: {max_attempts: 2, max_wall_seconds: 600, max_mpi_ranks: 1, memory_mib: 2048}
required_outputs: [mesh quality log, completed icoFoam log, velocity and pressure fields at 0.7 s]
acceptance_requirements: [checkMesh reports Mesh OK, icoFoam reaches 0.7 s and ends normally, required fields remain finite]
public_checks:
  - {name: mesh-quality, kind: mesh_ok, parameters: {}}
  - {name: target-solver, kind: command_executed, parameters: {executable: icoFoam}}
  - {name: normal-completion, kind: completion, parameters: {}}
  - {name: final-time, kind: final_time, parameters: {minimum: 0.7}}
  - {name: finite-fields, kind: finite_fields, parameters: {}}
  - {name: final-velocity, kind: requested_output, parameters: {path: 0.7/U}}
  - {name: final-pressure, kind: requested_output, parameters: {path: 0.7/p}}
public_assets: []
protected_paths: [/home/edwin/workplace/OpenFOAM-10/tutorials]
