schema_version: 3
task_id: laminar-cavity-graded
title: Graded-mesh lid-driven laminar cavity
openfoam_target:
  distribution: foundation
  version: '10'
resource_budget:
  max_attempts: 2
  max_wall_seconds: 600
  max_mpi_ranks: 1
  memory_mib: 2048
required_outputs:
- mesh quality log
- completed icoFoam log
- velocity and pressure fields at 0.7 s
public_assets: []
protected_paths: []
request_text: Starting from an empty case directory, reproduce the graded-mesh variant
  of the Foundation OpenFOAM v10 lid-driven cavity benchmark. Use a 0.1 m by 0.1 m
  two-dimensional square extruded 0.01 m, split into four equal blocks. Put 10 by
  10 by 1 cells in each block and grade each block by a factor of two toward the outside
  walls. Preserve movingWall, fixedWalls, and empty frontAndBack patches. Use icoFoam,
  nu=0.01 m2/s, initially zero U and p, lid velocity (1 0 0) m/s, deltaT=0.0025 s,
  and run from 0 to 0.7 s with writes at 0.1 s. Generate every native file, run blockMesh
  and checkMesh, solve serially, and do not read or copy an existing tutorial.
acceptance_intent:
- checkMesh reports Mesh OK
- icoFoam reaches 0.7 s and ends normally
- required fields remain finite
