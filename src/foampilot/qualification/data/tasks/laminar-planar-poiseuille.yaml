schema_version: 3
task_id: laminar-planar-poiseuille
title: Body-force-driven transient Maxwell Poiseuille flow
openfoam_target:
  distribution: foundation
  version: '10'
resource_budget:
  max_attempts: 2
  max_wall_seconds: 900
  max_mpi_ranks: 1
  memory_mib: 2048
required_outputs:
- mesh quality log
- completed pimpleFoam log through 25 s
- velocity, kinematic-pressure, and Maxwell stress fields at 25 s
- fields suitable for cyclic-flow balance and velocity-profile sampling
public_assets: []
protected_paths: []
request_text: Starting from an empty case directory, build and solve the transient
  laminar start-up of a planar Poiseuille flow. Model the half channel -0.1 <= x <=
  0.1 m, 0 <= y <= 1 m, and -0.1 <= z <= 0.1 m with a 1 by 40 by 1 block graded by
  a factor of 4 in y. Make the x-normal left and right patches a cyclic pair, the
  y=0 patch a no-slip wall, y=1 a symmetry plane, and the z-normal faces empty. Use
  pimpleFoam with base kinematic viscosity 0.1 m2/s and the laminar Maxwell momentum-transport
  model with nuM=1 m2/s and relaxation time lambda=5 s. Initialize U=(0 0 0) m/s,
  kinematic p=0 m2/s2, and the Maxwell stress field to zero. Drive the periodic flow
  with a uniform specific momentum source (5 0 0) m/s2 applied to all cells and retain
  a consistent pressure reference. Integrate from 0 to 25 s using deltaT=0.005 s and
  write every 1 s. Run serially. Generate all native Foundation OpenFOAM v10 files
  yourself, run blockMesh and checkMesh, and preserve U, p, and the Maxwell stress
  field for comparison with the analytical parabolic profile. Do not read or copy
  a pre-existing case.
acceptance_intent:
- checkMesh reports Mesh OK
- pimpleFoam reaches 25 s and ends normally
- required fields remain finite
- cyclic flow balance and analytical velocity profile pass evaluator checks
