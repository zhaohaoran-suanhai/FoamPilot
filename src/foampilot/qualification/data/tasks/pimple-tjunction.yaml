schema_version: 3
task_id: pimple-tjunction
title: Transient turbulent mixing in a T-junction
openfoam_target:
  distribution: foundation
  version: '10'
resource_budget:
  max_attempts: 2
  max_wall_seconds: 1200
  max_mpi_ranks: 4
  memory_mib: 3072
required_outputs:
- mesh quality and completed transient solver logs
- final velocity, pressure and turbulence fields
public_assets: []
protected_paths: []
request_text: Starting from an empty case directory, build a three-dimensional T-junction
  mixing case representative of the Foundation OpenFOAM v10 pimpleFoam tutorial. Join
  two rectangular inlet ducts orthogonally into one outlet duct using a conformal
  multi-block mesh of at least 20000 cells. Preserve inlet1, inlet2, outlet and wall
  patches. Use incompressible air with nu=1.5e-5 m2/s and k-epsilon RANS. Apply 1
  m/s at the main inlet, 0.5 m/s at the branch inlet, no slip at walls and p=0 at
  the outlet. Integrate with pimpleFoam to 1.5 s, adjustable time stepping and maxCo
  no greater than 1, writing every 0.1 s. Generate all files, run blockMesh and checkMesh,
  and preserve U, p, k, epsilon and nut without reading an existing case.
acceptance_intent:
- checkMesh reports Mesh OK
- pimpleFoam reaches 1.5 s and ends normally
- required fields remain finite
