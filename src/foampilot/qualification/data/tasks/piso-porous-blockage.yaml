schema_version: 1
task_id: piso-porous-blockage
title: Transient channel flow through a porous blockage
prompt: >-
  Starting from an empty case directory, build a two-dimensional channel
  from x=-2 to 6 m and y=-2 to 2 m, extruded from z=-0.1 to 0.1 m with a
  64 by 32 by 1 uniform mesh. Preserve inlet, outlet, top and bottom
  symmetry planes, and empty frontAndBack. Use pisoFoam, nu=5e-3 m2/s,
  inlet U=(1 0 0) m/s and fixed outlet p=0. Create a rectangular cellZone
  spanning x=0 to 2 m and y=-1 to 1 m using topoSet, and apply a Foundation
  v10 explicit Darcy-Forchheimer porous resistance in that zone with
  principal axes aligned to the global axes. Integrate to 100 s with
  deltaT=0.05 s and write each second. Generate every native file, run
  blockMesh, checkMesh, topoSet, and pisoFoam serially without reading or
  copying a pre-existing case.
openfoam_target: {distribution: foundation, version: "10"}
resource_budget: {max_attempts: 2, max_wall_seconds: 1200, max_mpi_ranks: 1, memory_mib: 2048}
required_outputs: [mesh quality log, completed pisoFoam log, U and p fields at 100 s]
acceptance_requirements: [checkMesh reports Mesh OK, pisoFoam reaches 100 s and ends normally, required fields remain finite]
public_checks:
  - {name: mesh-quality, kind: mesh_ok, parameters: {}}
  - {name: target-solver, kind: command_executed, parameters: {executable: pisoFoam}}
  - {name: normal-completion, kind: completion, parameters: {}}
  - {name: final-time, kind: final_time, parameters: {minimum: 100}}
  - {name: finite-fields, kind: finite_fields, parameters: {}}
  - {name: final-velocity, kind: requested_output, parameters: {path: 100/U}}
  - {name: final-pressure, kind: requested_output, parameters: {path: 100/p}}
public_assets: []
protected_paths: [/home/edwin/workplace/OpenFOAM-10/tutorials]
