schema_version: 1
task_id: rhopimple-shock-tube
title: Laminar compressible shock tube with rhoPimpleFoam
prompt: >-
  Starting from an empty case directory, build a one-dimensional shock tube
  from x=-5 to 5 m with a 1000 by 1 by 1 mesh and empty transverse faces.
  Use rhoPimpleFoam with laminar perfect-gas thermodynamics for air,
  molecular weight 28.96 kg/kmol, Cp=1004.5 J/(kg K), and constant dynamic
  transport. Initialize U=0. At x<0 set p=100000 Pa and T=348.432 K; at
  x>=0 set p=10000 Pa and T=278.746 K. Use coherent zero-gradient end
  conditions, initialize the two regions using setFields, integrate to
  0.007 s with deltaT=1e-5 s, and write every 0.001 s. Generate all native
  files, run blockMesh, checkMesh, setFields and rhoPimpleFoam serially, and
  do not read or copy a pre-existing case.
openfoam_target: {distribution: foundation, version: "10"}
resource_budget: {max_attempts: 2, max_wall_seconds: 1200, max_mpi_ranks: 1, memory_mib: 3072}
required_outputs: [mesh quality log, completed rhoPimpleFoam log, p T rho and U fields at 0.007 s]
acceptance_requirements: [checkMesh reports Mesh OK, rhoPimpleFoam reaches 0.007 s and ends normally, required fields remain finite]
public_checks:
  - {name: mesh-quality, kind: mesh_ok, parameters: {}}
  - {name: target-solver, kind: command_executed, parameters: {executable: rhoPimpleFoam}}
  - {name: normal-completion, kind: completion, parameters: {}}
  - {name: final-time, kind: final_time, parameters: {minimum: 0.007}}
  - {name: finite-fields, kind: finite_fields, parameters: {}}
  - {name: final-pressure, kind: requested_output, parameters: {path: 0.007/p}}
  - {name: final-temperature, kind: requested_output, parameters: {path: 0.007/T}}
  - {name: final-density, kind: requested_output, parameters: {path: 0.007/rho}}
public_assets: []
protected_paths: [/home/edwin/workplace/OpenFOAM-10/tutorials]
