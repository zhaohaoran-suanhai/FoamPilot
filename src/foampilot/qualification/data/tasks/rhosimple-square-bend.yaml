schema_version: 3
task_id: rhosimple-square-bend
title: Steady compressible turbulent flow through a square bend
openfoam_target:
  distribution: foundation
  version: '10'
resource_budget:
  max_attempts: 2
  max_wall_seconds: 1500
  max_mpi_ranks: 4
  memory_mib: 4096
required_outputs:
- valid bend mesh and completed rhoSimpleFoam log
- final thermofluid and turbulence fields
public_assets: []
protected_paths: []
request_text: Starting from an empty case directory, build a three-dimensional 90
  degree square duct bend representative of the Foundation OpenFOAM v10 rhoSimpleFoam
  squareBend case. Use a 0.1 m square cross-section, straight inlet and outlet legs
  each at least five hydraulic diameters long, a body-fitted multi-block mesh with
  at least 30000 cells, and inlet, outlet and wall patches. Model perfect-gas air
  with steady k-epsilon RANS. Prescribe 20 m/s and 300 K at the inlet, 1e5 Pa at the
  outlet, insulated no-slip walls, and coherent turbulence and thermophysical fields.
  Run blockMesh/checkMesh and rhoSimpleFoam through iteration 300, preserving p, U,
  T, k, epsilon, nut and alphat. Generate all files yourself and do not copy an existing
  case.
acceptance_intent:
- checkMesh reports Mesh OK
- rhoSimpleFoam reaches iteration 300 and ends normally
- pressure and temperature remain finite and positive
