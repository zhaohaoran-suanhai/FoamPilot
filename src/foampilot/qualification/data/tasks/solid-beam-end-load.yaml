schema_version: 3
task_id: solid-beam-end-load
title: Linear-elastic beam under an end traction
openfoam_target:
  distribution: foundation
  version: '10'
resource_budget:
  max_attempts: 2
  max_wall_seconds: 1200
  max_mpi_ranks: 1
  memory_mib: 2048
required_outputs:
- mesh quality log
- completed solidEquilibriumDisplacementFoam log
- displacement field at 10 s
public_assets: []
protected_paths: []
request_text: Starting from an empty case directory, build the Foundation v10 solidEquilibriumDisplacementFoam
  beam-end-load benchmark. Use a rectangular beam 30 m long, 1 m high and 1 m thick
  with a 6 by 2 by 1 block mesh. Preserve fixedEnd, tractionEnd, topSurface, bottomSurface,
  and empty side faces. Use rho=7854 kg/m3, E=2e11 Pa, Poisson ratio 0, Cp=434, kappa=60.5,
  alphav=1.1e-5, planeStress enabled, and an isothermal model with thermalStress disabled.
  Fix displacement at x=0 and apply the Foundation benchmark downward traction at
  x=30, with coherent conditions elsewhere. Initialize D=0 and T uniformly, integrate
  to 10 s with deltaT=2e-5 s and write at least every 0.025 s. Generate all files,
  run blockMesh, checkMesh and solidEquilibriumDisplacementFoam serially, without
  reading or copying a pre-existing case.
acceptance_intent:
- checkMesh reports Mesh OK
- solidEquilibriumDisplacementFoam reaches 10 s and ends normally
- required fields remain finite
