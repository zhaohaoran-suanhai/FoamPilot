    comparison_mode: relative_absolute
    tolerance: 0.1
    tolerance_source: Official-source golden pressure change with pilot-v1 RANS allowance.
  - name: downstream_velocity_profile
    category: physics_golden
    formula: Relative L2 error of streamwise velocity profiles at x=0.1 m and x=0.206 m
    field: U
