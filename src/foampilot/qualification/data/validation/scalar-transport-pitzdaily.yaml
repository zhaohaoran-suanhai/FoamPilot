      - [0.206, 0.0, 0.0]
      - [0.206, 0.015, 0.0]
    comparison_mode: relative_l2
    tolerance: 0.15
    tolerance_source: Task-matched official-mesh potential-flow baseline plus interpolation allowance.
notes:
